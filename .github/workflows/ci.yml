name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff pyyaml

      - name: Lint
        run: ruff check src tests

      - name: 测试
        run: pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编排插值必须成功（回归：.env 在仓库根，compose 项目目录却是 deploy/）
        run: |
          cat > .env <<'EOF'
          OCIX_SESSION_SECRET=testsecret
          OCIX_ADMIN_PASSWORD=testpass123
          OCIX_DOMAIN=example.com
          OCIX_ACME_EMAIL=a@example.com
          EOF
          cd deploy
          docker compose --env-file ../.env -f docker-compose.yml -f docker-compose.caddy.yml config >/dev/null
          docker compose --env-file ../.env -f docker-compose.yml -f docker-compose.direct.yml config >/dev/null
          echo "两种模式插值均正常"

      - name: 不带 --env-file 必须失败（证明这个参数不是可有可无）
        run: |
          cd deploy
          if docker compose -f docker-compose.yml -f docker-compose.direct.yml config >/dev/null 2>&1; then
            echo "预期应报缺少变量却成功了——说明必填校验失效" >&2
            exit 1
          fi
          echo "符合预期：缺 --env-file 时报错"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -f docker/Dockerfile -t ocix:ci .

      - name: 起容器做冒烟测试
        run: |
          docker run -d --name ocix-ci \
            -e OCIX_SESSION_SECRET=$(openssl rand -hex 32) \
            -e OCIX_ADMIN_PASSWORD=citestpass123 \
            -p 8000:8000 ocix:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1; then
              echo "healthy"; break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/health | tee /dev/stderr | grep -q '"ok":true'
          # 前端静态资源必须在构建期就下好，运行时不能依赖 CDN
          curl -fsS -o /dev/null http://localhost:8000/assets/vue.global.prod.js
          curl -fsS -o /dev/null http://localhost:8000/assets/element-plus.full.min.js
          curl -fsS http://localhost:8000/ | grep -q "OCIX"

      - name: 容器日志（失败时）
        if: failure()
        run: docker logs ocix-ci

      - name: 清理
        if: always()
        run: docker rm -f ocix-ci || true

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查部署脚本
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh
