[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocix"
dynamic = ["version"]
description = "Oracle Cloud Always Free 开机面板：多账户实例管理 + 免费额度硬闸门"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/674542449/ocix-panel"
Issues = "https://github.com/674542449/ocix-panel/issues"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocix = ["web/**/*", "VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI 的 Depends() 就是要写在默认值里
    "B904",   # 把 OCIError 转成 HTTPException 时刻意不带 traceback，避免内部细节外泄
]
