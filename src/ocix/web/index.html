<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>OCIX · Oracle Always Free 开机面板</title>
  <link rel="stylesheet" href="/assets/element-plus.css" />
  <link rel="stylesheet" href="/assets/element-plus-dark.css" />
  <style>
    :root {
      /* ── Obsidian & Cyber Sapphire (统一沉浸式暗黑黑曜石调色板) ── */
      --bg: #080c14;
      --surface: rgba(15, 23, 42, 0.72);
      --surface-2: rgba(30, 41, 59, 0.65);
      --raise: rgba(51, 65, 85, 0.5);
      --line: rgba(255, 255, 255, 0.08);
      --line-2: rgba(255, 255, 255, 0.16);
      --line-3: #64748b;
      --text: #f8fafc;
      --text-2: #cbd5e1;
      --text-3: #94a3b8;
      --hi: #ffffff;

      /* 主色：现代科技电光蓝 (HSV 79.9%) */
      --accent: #2b72d6;
      --accent-dim: #93c5fd;
      --on-accent: #ffffff;

      /* 状态色体系 (两两色相差 >= 40°，HSV 饱和度 <= 80%) */
      --ok: #289e6d;     /* 翡翠绿 155° (HSV 74.7%) */
      --warn: #af7d2b;   /* 琥珀金 37° (HSV 75.4%) */
      --crit: #c73a4d;   /* 柔和玫瑰红 352° (HSV 70.9%) */
      --idle: #64748b;   /* 黑曜灰 215° */

      --panel: var(--surface);
      --panel-2: var(--surface-2);
      --muted: var(--text-2);
      --ink: var(--bg);
      --rule: var(--line);
      --rule-2: var(--line-2);
      --rule-3: var(--line-3);

      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
      --shadow-subtle: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-card: 0 10px 30px -5px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
      --shadow-hover: 0 20px 40px -10px rgba(43, 114, 214, 0.25), 0 0 0 1px rgba(43, 114, 214, 0.4);
    }

    :root:root {
      --el-bg-color: rgba(15, 23, 42, 0.85);
      --el-bg-color-page: var(--bg);
      --el-bg-color-overlay: rgba(15, 23, 42, 0.95);
      --el-text-color-primary: var(--text);
      --el-text-color-regular: var(--text-2);
      --el-text-color-secondary: var(--text-3);
      --el-text-color-placeholder: #64748b;
      --el-border-color: rgba(255, 255, 255, 0.1);
      --el-border-color-light: rgba(255, 255, 255, 0.08);
      --el-border-color-lighter: rgba(255, 255, 255, 0.05);
      --el-border-color-extra-light: rgba(255, 255, 255, 0.03);
      --el-fill-color-blank: rgba(15, 23, 42, 0.6);
      --el-fill-color-light: rgba(30, 41, 59, 0.5);
      --el-fill-color-lighter: rgba(30, 41, 59, 0.3);
      --el-fill-color-dark: rgba(51, 65, 85, 0.6);
      
      --el-color-primary: #2b72d6;
      --el-color-primary-light-3: #6ba1ea;
      --el-color-primary-light-5: #93c5fd;
      --el-color-primary-light-7: #bfdbfe;
      --el-color-primary-light-8: #dbeafe;
      --el-color-primary-light-9: #eff6ff;
      --el-color-primary-dark-2: #2667bc;

      --el-color-success: #289e6d;
      --el-color-success-light-3: #58bf93;
      --el-color-success-light-5: #8ed6b6;
      --el-color-success-light-7: #c2ecd8;
      --el-color-success-light-8: #d8f4e7;
      --el-color-success-light-9: #effaf4;
      --el-color-success-dark-2: #1e7d56;

      --el-color-warning: #af7d2b;
      --el-color-warning-light-3: #cca35c;
      --el-color-warning-light-5: #dfbf85;
      --el-color-warning-light-7: #eed9b5;
      --el-color-warning-light-8: #f5e8d3;
      --el-color-warning-light-9: #faf5ed;
      --el-color-warning-dark-2: #8c6320;

      --el-color-danger: #c73a4d;
      --el-color-error: #c73a4d;
      --el-color-danger-light-3: #db6978;
      --el-color-danger-light-5: #e898a4;
      --el-color-danger-light-7: #f3c7cd;
      --el-color-danger-light-8: #f8dde2;
      --el-color-danger-light-9: #fdf2f4;
      --el-color-danger-dark-2: #a12b3b;

      --el-color-info: #64748b;
      --el-color-info-light-3: #94a3b8;
      --el-color-info-light-5: #cbd5e1;
      --el-color-info-light-7: #e2e8f0;
      --el-color-info-light-8: #f1f5f9;
      --el-color-info-light-9: #0f172a;
      --el-color-info-dark-2: #475569;

      --el-box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      --el-box-shadow-light: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    body { margin:0; font-family:var(--sans); background:var(--bg); color:var(--text);
           font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
           background-image: radial-gradient(80% 60% at 50% -10%, rgba(56,189,248,0.12), transparent 70%),
                             radial-gradient(60% 50% at 90% 80%, rgba(43,114,214,0.08), transparent 60%);
           background-attachment: fixed; }
    #app { min-height:100vh; }
    .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px; letter-spacing:-.01em; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

    /* 顶部全局进度条 */
    .netbar { position:fixed; top:0; left:0; height:2px; width:100%; z-index:2000;
              background:transparent; pointer-events:none; }
    .netbar > i { display:block; height:100%; width:100%; transform-origin:0 50%;
                  background:linear-gradient(90deg, #38bdf8, #818cf8);
                  animation:netbar 1.1s ease-in-out infinite; }
    @keyframes netbar {
      0%   { transform:scaleX(0);   opacity:1; }
      50%  { transform:scaleX(.65); opacity:1; }
      100% { transform:scaleX(1);   opacity:0; }
    }

    .spin { animation:spin 900ms linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .btn-icon { width:14px; height:14px; vertical-align:-2px; margin-right:5px; }

    /* 骨架屏 */
    .skel { border-radius:6px; background:linear-gradient(90deg,
            rgba(30,41,59,.4) 25%, rgba(51,65,85,.5) 37%, rgba(30,41,59,.4) 63%);
            background-size:400% 100%; animation:shimmer 1.3s ease-in-out infinite; }
    @keyframes shimmer { 0% { background-position:100% 50%; } 100% { background-position:0 50%; } }
    .skel-row { height:34px; margin-bottom:8px; }
    .skel-row:nth-child(2) { opacity:.8; }
    .skel-row:nth-child(3) { opacity:.6; }
    .skel-row:nth-child(4) { opacity:.4; }

    .stale { opacity:.55; transition:opacity .2s ease; pointer-events:none; }

    .topbar { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-4);
              padding:var(--sp-3) var(--sp-5); background:rgba(11, 15, 25, 0.82);
              border-bottom:1px solid rgba(255, 255, 255, 0.08);
              -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
              position:sticky; top:0; z-index:20; flex-wrap:wrap;
              box-shadow:0 4px 20px -2px rgba(0,0,0,0.4); }
    .brand { display:flex; align-items:center; gap:9px; white-space:nowrap; }
    .brand .wordmark { font-family:var(--mono); font-weight:700; font-size:15px;
                       letter-spacing:.16em; color:#ffffff; }
    .brand .wordmark b { color:#38bdf8; font-weight:700; }
    .brand small { display:block; font-weight:400; font-size:10px; color:var(--text-3);
                   letter-spacing:0; }
    .topbar-right { display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap; }
    .who { color:var(--text-2); font-size:12.5px; }

    /* 左侧竖向导航 + 右侧内容 */
    .shell { display:flex; align-items:flex-start; min-height:calc(100vh - 57px); }
    .rail { width:212px; flex:none; padding:var(--sp-4) var(--sp-3); align-self:stretch;
            border-right:1px solid rgba(255, 255, 255, 0.08);
            background:rgba(11, 15, 25, 0.65); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
            position:sticky; top:57px; max-height:calc(100vh - 57px); overflow-y:auto; }
    .rail-group + .rail-group { margin-top:var(--sp-4); }
    .rail-title { font-size:10px; letter-spacing:.14em; text-transform:uppercase;
                  color:var(--text-3); padding:0 10px var(--sp-2); font-weight:600; }
    .rail-item { display:flex; align-items:center; gap:10px; width:100%; text-align:left;
                 background:none; border:0; color:var(--text-2); font-family:var(--sans);
                 font-size:13.5px; padding:9px 12px; border-radius:8px; cursor:pointer;
                 transition:background .18s ease, color .18s ease, transform .15s ease; position:relative; }
    .rail-item svg { width:16px; height:16px; flex:none; opacity:.8; }
    .rail-item:hover { background:rgba(255, 255, 255, 0.06); color:#ffffff; }
    .rail-item.on { background:linear-gradient(90deg, rgba(56, 189, 248, 0.16), rgba(56, 189, 248, 0.04));
                    color:#38bdf8; font-weight:600; }
    .rail-item.on svg { opacity:1; color:#38bdf8; }
    .rail-item.on::before { content:""; position:absolute; left:0; top:8px; bottom:8px;
                            width:3px; border-radius:0 3px 3px 0;
                            background:#38bdf8; box-shadow:0 0 8px #38bdf8; }
    .rail-item em { margin-left:auto; font-style:normal; font-size:11px; font-weight:600;
                    background:var(--crit); color:#ffffff; border-radius:9px; padding:1px 6px; }
    .main { flex:1; min-width:0; padding:var(--sp-5); max-width:1440px; }
    .pane { display:block; }
    .pane > .card + .card { margin-top:var(--sp-4); }

    .container { max-width:1440px; margin:0 auto; padding:var(--sp-5); }
    .toolbar { display:flex; gap:var(--sp-3); flex-wrap:wrap; align-items:center; margin-bottom:var(--sp-4); }
    .card { background:rgba(15, 23, 42, 0.72); border:1px solid rgba(255, 255, 255, 0.08); border-radius:14px;
            padding:var(--sp-5); margin-bottom:var(--sp-4);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
            -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }
    .card-head { display:flex; align-items:center; justify-content:space-between;
                 gap:var(--sp-3); margin-bottom:var(--sp-4); flex-wrap:wrap; }
    .card > .card-head { margin:calc(var(--sp-5) * -1) calc(var(--sp-5) * -1) var(--sp-4);
                         padding:14px var(--sp-5); border-bottom:1px solid rgba(255, 255, 255, 0.08);
                         background:rgba(255, 255, 255, 0.02);
                         border-radius:14px 14px 0 0; }
    .card-title { margin:0; font-size:15px; font-weight:600; letter-spacing:.01em;
                  color:#ffffff; }

    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
               overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
    .skip-link { position:fixed; left:var(--sp-3); top:-60px; z-index:3000;
                 background:var(--accent); color:#080c14; font-weight:600;
                 padding:9px 14px; border-radius:0 0 8px 8px; text-decoration:none;
                 transition:top .18s ease; }
    .skip-link:focus { top:0; }
    #main-content:focus { outline:none; }
    .table-wrap { overflow-x:auto; }

    .mark { flex:none; display:block; }
    .mark .cell-sm { fill:var(--text-3); }
    .mark .cell-lg { fill:var(--accent); }

    /* ── 登录页 ── */
    .login-scene { position:fixed; inset:0; overflow:hidden; background:#0b0f19;
                   display:grid; grid-template-rows:auto 1fr auto; }
    .login-canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
    .login-veil { position:absolute; inset:0; pointer-events:none;
                  background:
                    radial-gradient(80% 70% at 50% 45%, rgba(15,23,42,.82), rgba(11,15,25,.95) 75%),
                    linear-gradient(180deg, rgba(11,15,25,.65), transparent 25%, transparent 70%, rgba(11,15,25,.9)); }

    .login-hud { position:relative; padding:20px 32px; z-index:10; }
    .login-hud-top { display:flex; align-items:center; justify-content:space-between; }
    .login-brand { display:flex; align-items:center; gap:14px; }
    .login-wordmark { font-family:var(--mono); font-size:24px; font-weight:700;
                      letter-spacing:.18em; color:#ffffff; line-height:1.1; }
    .login-wordmark b { color:#38bdf8; font-weight:700; }
    .login-eyebrow { font-family:var(--mono); font-size:10px; letter-spacing:.25em;
                     text-transform:uppercase; color:#94a3b8; margin:0 0 2px; }

    .login-stage { position:relative; display:flex; align-items:center; justify-content:center;
                   padding:0 24px; min-height:0; z-index:10; }
    .login-panel { width:100%; max-width:410px; padding:36px 32px;
                   background:rgba(15, 23, 42, 0.78); border:1px solid rgba(255,255,255,.14);
                   border-radius:18px;
                   box-shadow:0 30px 60px -12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1);
                   -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px);
                   animation:panel-in .55s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes panel-in { from { opacity:0; transform:translateY(14px); }
                          to   { opacity:1; transform:none; } }
    .login-panel-head { display:flex; align-items:center; gap:14px; margin-bottom:24px; }
    .login-icon-badge { width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg, rgba(43,114,214,.3), rgba(56,189,248,.15));
                        border:1px solid rgba(56,189,248,.3); display:flex; align-items:center; justify-content:center; color:#38bdf8; flex:none; }
    .login-panel h2 { margin:0 0 3px; font-size:19px; font-weight:700; color:#ffffff; letter-spacing:-.01em; }
    .login-sub { color:#94a3b8; font-size:12.5px; margin:0; line-height:1.4; }
    .login-panel .el-form-item { margin-bottom:18px; }
    .login-panel .el-form-item__label { color:#cbd5e1 !important; font-weight:500; font-size:13px; margin-bottom:6px !important; }
    .login-panel .el-input__wrapper { background:rgba(30, 41, 59, 0.7) !important; border:1px solid rgba(255,255,255,.12) !important;
                                      border-radius:9px !important; box-shadow:none !important; padding:4px 12px !important; }
    .login-panel .el-input__wrapper.is-focus { border-color:#38bdf8 !important; box-shadow:0 0 0 3px rgba(56,189,248,.2) !important; }
    .login-panel .el-input__inner { color:#ffffff !important; font-size:14px; }
    .login-panel .el-input__inner::placeholder { color:#64748b; }
    .login-panel .el-button--large { border-radius:9px; height:44px; font-size:14.5px; font-weight:600;
                                     background:#2b72d6; border-color:#2b72d6;
                                     box-shadow:0 4px 14px rgba(43,114,214,.4); transition:all .2s ease; }
    .login-panel .el-button--large:hover { background:#3b82f6; border-color:#3b82f6; transform:translateY(-1px); }
    .login-hint-bar { margin-top:20px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:11.5px; color:#64748b; }

    .login-hud-bottom { display:flex; align-items:center; justify-content:space-between;
                        gap:var(--sp-4); flex-wrap:wrap;
                        border-top:1px solid rgba(255,255,255,.08); z-index:10; }
    .hud-chips { display:flex; gap:10px; flex-wrap:wrap; }
    .chip { display:inline-flex; align-items:center; gap:8px; padding:7px 12px;
            border:1px solid rgba(255,255,255,.12); border-radius:8px; background:rgba(30,41,59,.72);
            font-size:11.5px; color:#cbd5e1; white-space:nowrap;
            animation:panel-in .5s cubic-bezier(.2,.7,.3,1) both; }
    .chip:nth-child(2) { animation-delay:.07s; }
    .chip:nth-child(3) { animation-delay:.14s; }
    .chip b { color:#ffffff; font-weight:600; }
    .chip-spec { color:#94a3b8; }
    .chip-arm { border-color:rgba(56,189,248,.4); background:rgba(15,23,42,.8); }
    .led { flex:none; width:7px; height:7px; border-radius:50%; background:var(--ok);
           animation:breathe 3.2s ease-in-out infinite; }
    .chip:nth-child(2) .led { animation-delay:-1.3s; }
    .chip-arm .led { animation-delay:-2.4s; }
    .hud-meta { font-size:11.5px; color:#94a3b8; letter-spacing:.05em;
                display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .hud-meta code { background:rgba(56,189,248,.15); color:#38bdf8;
                     padding:2px 6px; border-radius:4px; font-size:11px; }
    .hud-flow { color:#38bdf8; opacity:.95; }
    .hud-flow .arrow { color:#64748b; margin:0 5px; }

    @media (max-width: 900px) {
      .login-hud { padding:var(--sp-4); }
      .login-stage { padding:0 var(--sp-4); }
      .login-panel { max-width:420px; }
      .login-hud-bottom { justify-content:center; }
      .hud-meta { display:none; }
    }
    @media (max-width: 560px) {
      .chip-spec { display:none; }
      .chip { padding:6px 10px; font-size:11px; gap:6px; }
      .hud-chips { gap:6px; }
      .login-hud { padding:var(--sp-3); }
      .login-panel { padding:24px 20px; }
    }

    .rail-foot { margin-top:var(--sp-5); padding:var(--sp-3) 10px 0; border-top:1px solid rgba(255, 255, 255, 0.08);
                 display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2); }
    .rail-foot .ver { font-family:var(--mono); font-size:11px; color:var(--text-3); }
    .rail-foot .svc { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--text-2); }

    .alloc-k { font-family:var(--mono); font-size:10px; letter-spacing:.12em;
               text-transform:uppercase; color:var(--text-3); }
    .alloc-v { font-size:13px; color:var(--text); font-variant-numeric:tabular-nums; }

    /* ── 状态点 ── */
    .state { display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
    .dot { width:8px; height:8px; border-radius:50%; flex:none; position:relative;
           background:var(--idle); }
    .dot.ok { background:var(--ok); animation:breathe 3.2s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { transform:scale(.78); background:#1b6d4b;
                 box-shadow:0 0 0 0 rgba(40,158,109,.5), 0 0 4px 0 rgba(40,158,109,.35); }
      50%      { transform:scale(1.2); background:#289e6d;
                 box-shadow:0 0 0 5px rgba(40,158,109,.18), 0 0 16px 3px rgba(40,158,109,.9); }
    }
    .el-table tbody tr:nth-child(3n+2) .dot.ok { animation-delay:-1.1s; }
    .el-table tbody tr:nth-child(3n+3) .dot.ok { animation-delay:-2.2s; }
    .dot.crit { background:transparent; box-shadow:inset 0 0 0 1.5px var(--crit); }
    .dot.warn { background:var(--warn); animation:pulse 1.6s ease-out infinite; }
    .dot.attn { background:var(--warn); border-radius:2px;
                box-shadow:0 0 0 1px var(--bg), 0 0 0 2.5px rgba(175,125,43,.45); }
    .dot.idle { background:var(--idle); }
    .state-label { font-size:12px; font-variant-numeric:tabular-nums; color:var(--text-2); }
    @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(175,125,43,.5); } 70% { box-shadow:0 0 0 7px rgba(175,125,43,0); } 100% { box-shadow:0 0 0 0 rgba(175,125,43,0); } }

    /* ── 额度总览仪表盘 ── */
    .fleet { display:flex; gap:var(--sp-5); flex-wrap:wrap; align-items:center;
             padding:14px 18px; margin-bottom:var(--sp-4);
             background:rgba(30, 41, 59, 0.4); border:1px solid rgba(255, 255, 255, 0.08); border-radius:12px;
             -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); }
    .meter { min-width:190px; flex:1; }
    .meter-head { display:flex; align-items:baseline; justify-content:space-between; gap:8px;
                  margin-bottom:6px; }
    .meter-k { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); font-weight:600; }
    .meter-v { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:15px;
               font-weight:700; color:#ffffff; }
    .meter-v small { font-size:11.5px; font-weight:400; color:var(--text-3); margin-left:2px; }

    .term-dialog .el-dialog__body { padding:0; }
    .term-wrap { background:#030712; padding:12px 14px; height:62vh; min-height:320px; }
    .term-wrap .xterm { height:100%; }
    .term-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
                padding:12px 16px; border-bottom:1px solid rgba(255, 255, 255, 0.08); background:rgba(30, 41, 59, 0.6); }
    .term-bar .who { margin-left:auto; }

    .dl { display:grid; grid-template-columns:110px 1fr; gap:10px 16px; font-size:13px; }
    .dl dt { color:var(--text-3); font-size:12px; }
    .dl dd { margin:0; word-break:break-all; color:var(--text); }
    .drawer-sec { margin-top:var(--sp-5); border-top:1px solid rgba(255, 255, 255, 0.08); padding-top:var(--sp-4); }
    .drawer-sec:first-child { border-top:0; margin-top:0; padding-top:0; }
    .drawer-sec > h3 { margin:0 0 var(--sp-3); font-size:13.5px; font-weight:600; color:#ffffff;
                       display:flex; align-items:center; justify-content:space-between; }

    .kv { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

    .stats { display:flex; gap:var(--sp-5); flex-wrap:wrap; }
    .stat { min-width:92px; }
    .stat .v { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:24px; font-weight:700; line-height:1.2; }
    .stat .k { font-size:11px; color:var(--text-3); letter-spacing:.05em; text-transform:uppercase; margin-top:3px; }
    .stat.ok .v { color:var(--ok); } .stat.idle .v { color:var(--text-3); } .stat.crit .v { color:var(--crit); }

    .bulkbar { display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap;
               background:rgba(56, 189, 248, 0.08); border:1px solid rgba(56, 189, 248, 0.25); border-radius:10px;
               padding:var(--sp-2) var(--sp-3); margin-bottom:var(--sp-3); }
    .bulkbar .count { font-family:var(--mono); font-size:12.5px; color:#38bdf8; font-weight:600; }

    .quota { display:grid; grid-template-columns:160px 1fr 140px; gap:var(--sp-4);
             align-items:center; padding:12px 0; border-bottom:1px solid rgba(255, 255, 255, 0.06); }
    .quota:last-child { border-bottom:0; }
    .quota .label { font-size:13px; color:var(--text-2); font-weight:500; }
    .quota .num { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:13px; text-align:right; }
    .quota .num b { color:#ffffff; font-weight:600; }
    .bar { height:6px; background:rgba(255, 255, 255, 0.08); border-radius:3px; overflow:hidden; }
    .bar > i { display:block; height:100%; background:linear-gradient(90deg, #38bdf8, #818cf8); transition:width .3s ease;
               box-shadow:0 0 10px rgba(56, 189, 248, 0.5); }
    .bar.warn > i { background:var(--warn); box-shadow:0 0 10px rgba(245, 158, 11, 0.5); }

    .create-grid { display:grid; grid-template-columns:minmax(0, 1.35fr) minmax(320px, 1fr); gap:var(--sp-5); align-items:start; }
    .pf-card { background:rgba(15, 23, 42, 0.75); border:1px solid rgba(255, 255, 255, 0.1); border-radius:14px;
               padding:var(--sp-4); position:sticky; top:80px; box-shadow:0 12px 36px rgba(0, 0, 0, 0.5);
               -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }
    .pf-card.ok { border-color:rgba(16, 185, 129, 0.4); box-shadow:0 12px 36px rgba(16, 185, 129, 0.1); }
    .pf-card.bad { border-color:rgba(244, 63, 94, 0.4); box-shadow:0 12px 36px rgba(244, 63, 94, 0.1); }
    .pf-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .pf-row { display:flex; align-items:center; justify-content:space-between; gap:12px;
              padding:10px 0; border-bottom:1px solid rgba(255, 255, 255, 0.06); font-size:12.5px; }
    .pf-row:last-child { border-bottom:0; }
    .pf-label { font-weight:500; color:var(--text-2); flex:1; min-width:80px; }
    .pf-calc { font-family:var(--mono); font-size:12px; color:var(--text-3); text-align:right; white-space:nowrap; }
    .pf-calc em { color:#38bdf8; font-style:normal; font-weight:600; margin:0 2px; }
    .pf-calc b { color:#ffffff; font-weight:700; }
    .pf-msg { margin-top:10px; padding:9px 12px; border-radius:8px; font-size:12px; line-height:1.55; }
    .pf-msg.crit { color:#fda4af; background:rgba(244, 63, 94, 0.12);
                   border:1px solid rgba(244, 63, 94, 0.3); border-left:3px solid var(--crit); }
    .pf-msg.warn { color:#fde68a; background:rgba(245, 158, 11, 0.12);
                   border:1px dashed rgba(245, 158, 11, 0.3); border-left:3px dashed var(--warn); }
    .create-step { margin-top:12px; padding:10px 14px; background:rgba(56, 189, 248, 0.1); border:1px solid rgba(56, 189, 248, 0.25);
                   border-radius:8px; display:flex; align-items:center; gap:8px; font-size:12.5px;
                   color:#38bdf8; font-weight:600; }
    .el-table .orphan-row td { background:rgba(244, 63, 94, 0.1) !important; }
    .el-table .orphan-row td:first-child { box-shadow:inset 3px 0 0 var(--crit); }
    code { font-family:var(--mono); font-size:12px; background:rgba(255, 255, 255, 0.08); padding:2px 6px; border-radius:4px; color:#38bdf8; }
    @media (max-width:1100px) {
      .create-grid { grid-template-columns:1fr; }
      .pf-card { position:static; }
    }

    .seg { display:inline-flex; border:1px solid rgba(255, 255, 255, 0.12); border-radius:8px; overflow:hidden; background:rgba(15, 23, 42, 0.6); }
    .seg button { appearance:none; border:0; background:transparent; color:var(--text-2);
                  font-family:var(--sans); font-size:12.5px; padding:7px 14px; cursor:pointer;
                  border-right:1px solid rgba(255, 255, 255, 0.12); transition:all .18s ease; }
    .seg button:last-child { border-right:0; }
    .seg button:hover { background:rgba(255, 255, 255, 0.08); color:#ffffff; }
    .seg button.on { background:var(--accent); color:#080c14; font-weight:700; }

    .vpu-cell { display:flex; align-items:center; gap:8px; }
    .vpu-tier { font-size:11.5px; color:var(--text-3); white-space:nowrap; }
    .vpu-tier.paid { color:var(--warn); font-weight:600; }
    .rule-form { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
                 background:rgba(30, 41, 59, 0.45); border:1px solid rgba(255, 255, 255, 0.08);
                 border-radius:10px; padding:var(--sp-3); }
    .rule-sep { color:var(--text-3); font-size:12.5px; }

    .fw-verdict { display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap;
                  background:rgba(30, 41, 59, 0.45); border:1px solid rgba(255, 255, 255, 0.08); border-radius:10px;
                  padding:var(--sp-3) var(--sp-4); margin-bottom:var(--sp-3); }
    .fw-verdict.open { border-color:rgba(245, 158, 11, 0.5); border-left-width:3px; }
    .fw-verdict.partial { border-color:rgba(16, 185, 129, 0.5); border-left-width:3px; }
    .fw-verdict b { display:block; font-size:13.5px; color:#ffffff; }
    .fw-verdict span { font-size:12px; color:var(--text-2); }
    .fw-actions { margin-left:auto; }

    .ver-row { display:flex; align-items:center; gap:var(--sp-4); margin-bottom:var(--sp-4); }
    .ver-box { background:rgba(30, 41, 59, 0.45); border:1px solid rgba(255, 255, 255, 0.08); border-radius:10px;
               padding:var(--sp-3) var(--sp-4); min-width:130px; }
    .ver-box .k { font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:.05em; }
    .ver-box .v { font-size:19px; font-weight:700; margin-top:2px; color:#ffffff; }
    .ver-arrow { color:var(--text-3); font-size:18px; }
    .cmd-box { display:flex; align-items:center; gap:var(--sp-2); background:#030712;
               border:1px solid rgba(255, 255, 255, 0.1); border-radius:8px; padding:10px 12px;
               margin:var(--sp-2) 0 var(--sp-3); overflow-x:auto; }
    .cmd-box code { background:none; padding:0; color:#38bdf8; white-space:nowrap; font-size:12.5px; }
    .cmd-box .copy-btn { margin-left:auto; flex:none; color:#94a3b8; }
    .cmd-box .copy-btn:hover { color:#ffffff; }
    .log-box { background:#030712; border:1px solid rgba(255, 255, 255, 0.1); border-radius:8px;
               padding:10px 12px; margin:var(--sp-3) 0 0;
               max-height:260px; overflow:auto; }
    .log-box pre { margin:0; white-space:pre-wrap; word-break:break-word;
                   color:#e2e8f0; font-size:12px; line-height:1.65; font-family:var(--mono); }

    .link { color:var(--accent); text-decoration:underline; text-underline-offset:3px;
            text-decoration-color:rgba(43,114,214,.45); transition:text-decoration-color .18s ease, color .18s ease; }
    .link:hover { color:#6ba1ea; text-decoration-color:currentColor; }

    .empty { text-align:center; color:var(--text-3); padding:var(--sp-6) var(--sp-4); font-size:13px; }
    .empty b { display:block; color:#ffffff; font-size:14.5px; margin-bottom:6px; font-weight:600; }
    .ip-cell { display:inline-flex; align-items:center; gap:6px; max-width:100%; }
    .ip-stack { display:flex; flex-direction:column; gap:1px; line-height:1.35; }
    .ip-sub { font-size:11px; color:var(--text-3); }
    .ip-trunc { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row-actions { display:flex; flex-wrap:nowrap; align-items:center; gap:5px; }
    .row-actions .el-button { margin-left:0 !important; padding-left:9px; padding-right:9px; }
    .row-actions .el-button.term-btn { padding-left:5px; padding-right:5px; }

    .mini-btn { background:rgba(255, 255, 255, 0.08); border:1px solid rgba(255, 255, 255, 0.12); color:var(--text-2);
                font-family:var(--sans); font-size:11px; line-height:1; padding:3px 6px;
                border-radius:4px; cursor:pointer; transition:all .18s ease; }
    .mini-btn:hover { color:#38bdf8; border-color:#38bdf8; background:rgba(56, 189, 248, 0.12); }
    .el-button.term-btn { color:var(--crit); padding-left:6px; padding-right:6px; }
    .el-button.term-btn:hover, .el-button.term-btn:focus-visible {
      color:#fda4af; background:rgba(244, 63, 94, 0.15); border-color:rgba(244, 63, 94, 0.4); }
    .copy-btn { background:none; border:0; color:var(--text-3); cursor:pointer; padding:2px;
                border-radius:4px; line-height:0; transition:color .18s ease, background .18s ease; }
    .copy-btn:hover { color:#38bdf8; background:rgba(255, 255, 255, 0.08); }
    .el-button, .copy-btn, .el-select, [role="tab"] { cursor:pointer; }
    .el-table .cell { line-height:1.45; }

    /* ── Element Plus 深度暗黑重写 ── */
    .el-table { background:transparent !important; color:var(--text) !important; }
    .el-table th.el-table__cell { background:rgba(30, 41, 59, 0.7) !important; color:var(--text-2) !important; border-bottom:1px solid rgba(255, 255, 255, 0.08) !important; font-weight:600; }
    .el-table td.el-table__cell { background:rgba(15, 23, 42, 0.45) !important; border-bottom:1px solid rgba(255, 255, 255, 0.05) !important; }
    .el-table--striped .el-table__body tr.el-table__row--striped td.el-table__cell { background:rgba(30, 41, 59, 0.3) !important; }
    .el-table__body tr:hover > td.el-table__cell { background:rgba(56, 189, 248, 0.08) !important; }
    
    .el-drawer { background:rgba(11, 15, 25, 0.96) !important; -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px); border-left:1px solid rgba(255, 255, 255, 0.1) !important; }
    .el-dialog { background:rgba(15, 23, 42, 0.95) !important; -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px); border:1px solid rgba(255, 255, 255, 0.12) !important; border-radius:14px; }
    
    .el-input__wrapper, .el-textarea__inner { background:rgba(30, 41, 59, 0.6) !important; border:1px solid rgba(255, 255, 255, 0.1) !important; box-shadow:none !important; color:#ffffff !important; }
    .el-input__wrapper.is-focus, .el-textarea__inner:focus { border-color:#38bdf8 !important; box-shadow:0 0 0 2px rgba(56, 189, 248, 0.2) !important; }
    .el-input__inner { color:#ffffff !important; }
    
    :root .el-button--primary { --el-button-bg-color:#38bdf8; --el-button-border-color:#38bdf8;
      --el-button-text-color:#080c14; --el-button-hover-bg-color:#7dd3fc;
      --el-button-hover-border-color:#7dd3fc; --el-button-hover-text-color:#080c14;
      --el-button-active-bg-color:#255494; --el-button-active-border-color:#255494;
      font-weight:700; }
    :root .el-button--danger { --el-button-bg-color:transparent; --el-button-border-color:rgba(244, 63, 94, 0.5);
      --el-button-text-color:#f43f5e; --el-button-hover-bg-color:rgba(244, 63, 94, 0.15);
      --el-button-hover-border-color:#f43f5e; --el-button-hover-text-color:#fda4af;
      font-weight:600; }
    :root .el-alert--error, :root .el-alert--warning { border-left:3px solid var(--warn); background:rgba(245, 158, 11, 0.1) !important; color:var(--text) !important; }
    :root .el-alert--error { border-left-color:var(--crit); background:rgba(244, 63, 94, 0.1) !important; }
    :root .el-alert--info { background:rgba(56, 189, 248, 0.08) !important; border-left:3px solid #38bdf8; color:var(--text) !important; }
    :root .el-progress-bar__inner { background-color:var(--accent); }

    @media (max-width:900px) {
      .shell { display:block; }
      .rail { width:auto; position:static; max-height:none; border-right:0;
              border-bottom:1px solid rgba(255, 255, 255, 0.08); padding:var(--sp-2) var(--sp-3);
              overflow-x:auto; overflow-y:hidden; }
      .rail nav { display:flex; gap:var(--sp-3); }
      .rail-group { display:flex; align-items:center; gap:4px; }
      .rail-group + .rail-group { margin-top:0; padding-left:var(--sp-3);
                                  border-left:1px solid rgba(255, 255, 255, 0.08); }
      .rail-title { display:none; }
      .rail-item { width:auto; white-space:nowrap; padding:9px 12px; }
      .rail-item.on::before { display:none; }
      .main { padding:var(--sp-3); }
    }
    @media (max-width:860px) {
      .container { padding:var(--sp-3); }
      .quota { grid-template-columns:1fr; gap:var(--sp-1); }
      .quota .num { text-align:left; }
      .el-table .el-button--small { min-height:36px; padding-left:12px; padding-right:12px; }
      .el-table .el-button + .el-button { margin-left:8px; }
      .bulkbar .el-button { min-height:36px; }
      .seg button { padding:10px 14px; }
    }
    .copy-btn { position:relative; }
    .copy-btn::after { content:""; position:absolute; left:50%; top:50%;
                       width:44px; height:44px; transform:translate(-50%,-50%); }
    @media (prefers-reduced-motion: reduce) {
      .netbar > i, .skel, .spin { animation:none !important; }
      .netbar > i { transform:scaleX(1); opacity:.9; }
      *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important;
                               animation-delay:0s !important; transition-duration:.001ms !important; }
      .dot.warn { box-shadow:0 0 0 1px var(--bg), 0 0 0 2px var(--warn),
                             0 0 0 3px var(--bg), 0 0 0 4px rgba(175,125,43,.5); }
      .dot.ok, .led { box-shadow:0 0 0 3px rgba(40,158,109,.2), 0 0 8px 2px rgba(40,158,109,.5); }
    }
  </style>
</head>
<body>
<div id="app"></div>

<script type="text/html" id="app-tpl">
  <!-- ── 登录 ── -->
  <div class="login-scene" v-if="!token">
    <!-- 场景：真实的 Oracle 区域节点，以及区域之间流动的数据包。
         纯装饰，读屏器跳过。 -->
    <canvas class="login-canvas" ref="loginCanvas" aria-hidden="true"></canvas>
    <div class="login-veil" aria-hidden="true"></div>

    <header class="login-hud login-hud-top">
      <div class="login-brand">
        <svg class="mark" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true">
          <rect class="cell-sm" x="3.5" y="3.5" width="7" height="7" rx="1.6" />
          <rect class="cell-sm" x="3.5" y="13.5" width="7" height="7" rx="1.6" />
          <rect class="cell-lg" x="13.5" y="3.5" width="7" height="17" rx="1.6" />
        </svg>
        <div>
          <p class="login-eyebrow">Oracle Cloud Always Free</p>
          <div class="login-wordmark">OCI<b>X</b></div>
        </div>
      </div>
    </header>

    <main class="login-stage">
      <section class="login-panel">
        <div class="login-panel-head">
          <div class="login-icon-badge">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </div>
          <div>
            <h2>控制台登录</h2>
            <p class="login-sub">连接并管理你的 Always Free 实例</p>
          </div>
        </div>

        <el-alert v-if="loginErr" :title="loginErr" type="error" show-icon :closable="false"
                  style="margin-bottom:16px;" />
        <el-form @submit.prevent="doLogin" label-position="top">
          <el-form-item label="管理员账号">
            <el-input v-model="loginForm.username" size="large" autocomplete="username"
                      placeholder="请输入用户名" @keyup.enter="doLogin" />
          </el-form-item>
          <el-form-item label="登录密码">
            <el-input v-model="loginForm.password" type="password" size="large" show-password
                      placeholder="请输入登录密码" autocomplete="current-password" @keyup.enter="doLogin" />
          </el-form-item>
          <el-button type="primary" size="large" style="width:100%; margin-top:8px;" @click="doLogin"
                     :loading="loading">登录控制台</el-button>
        </el-form>
        <div class="login-hint-bar">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span>自建私有控制台 · 数据与私钥仅存本地</span>
        </div>
      </section>
    </main>

    <footer class="login-hud login-hud-bottom">
      <div class="hud-chips" aria-label="Always Free 额度">
        <span class="chip"><i class="led" aria-hidden="true"></i><b>AMD Micro</b><span class="chip-spec">1 OCPU · 1 GB</span></span>
        <span class="chip"><i class="led" aria-hidden="true"></i><b>AMD Micro</b><span class="chip-spec">1 OCPU · 1 GB</span></span>
        <span class="chip chip-arm"><i class="led" aria-hidden="true"></i><b>ARM Ampere A1</b><span class="chip-spec">4 OCPU · 24 GB</span></span>
      </div>
      <div class="hud-meta mono">
        <span>200 GB 免费存储额度</span>
        <span>共用子网 <code>10.0.0.0/24</code></span>
        <span class="hud-flow" ref="loginFlow" aria-hidden="true"></span>
      </div>
    </footer>
  </div>

  <!-- ── 主面板 ── -->
  <div v-else>
    <!-- 键盘用户每换一页都要 Tab 过顶栏和 11 项导航才够得着内容，给一条捷径。
         必须是文档里第一个可聚焦的元素，否则先聚焦到的是顶栏的开关。
         平时收在屏幕外，聚焦时才滑出来。 -->
    <a class="skip-link" href="#main-content">跳到主内容</a>
    <div class="netbar" v-show="netBusy" aria-hidden="true"><i></i></div>
    <div class="topbar">
      <div class="brand">
        <svg class="mark" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">
          <rect class="cell-sm" x="3.5" y="3.5" width="7" height="7" rx="1.6" />
          <rect class="cell-sm" x="3.5" y="13.5" width="7" height="7" rx="1.6" />
          <rect class="cell-lg" x="13.5" y="3.5" width="7" height="17" rx="1.6" />
        </svg>
        <div>
          <div class="wordmark">OCI<b>X</b></div>
          <small>Always Free 开机面板</small>
        </div>
      </div>
      <div class="topbar-right">
        <span class="live" v-if="autoRefresh">
          <i class="dot ok"></i>{{ countdown }}s 后自动刷新
        </span>
        <el-switch v-model="autoRefresh" size="small" active-text="自动刷新" />
        <span class="who">{{ user }}</span>
        <el-button size="small" @click="logout">退出</el-button>
      </div>
    </div>

    <div class="shell">
      <!-- 左侧导航 -->
      <aside class="rail">
        <nav>
          <div class="rail-group" v-for="g in NAV" :key="g.title">
            <div class="rail-title">{{ g.title }}</div>
            <button v-for="it in g.items" :key="it.name" type="button" class="rail-item"
                    :class="{ on: activeTab === it.name }"
                    :aria-current="activeTab === it.name ? 'page' : null"
                    @click="go(it.name)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path :d="it.icon" />
              </svg>
              <span>{{ it.label }}</span>
              <em v-if="it.name === 'storage' && orphanBadge">{{ orphanBadge }}</em>
            </button>
          </div>
        </nav>
        <div class="rail-foot">
          <span class="ver">v{{ appVersion || '—' }}</span>
          <span class="svc" :title="serviceHint">
            <i :class="['dot', serviceOk ? 'ok' : 'crit']"></i>{{ serviceOk ? '服务正常' : '连接异常' }}
          </span>
        </div>
      </aside>

      <main class="main" id="main-content" tabindex="-1">
        <!-- 每页一个标题。视觉上不显示——左侧导航已经标了当前位置，
             密集面板再摆一行大标题是浪费纵向空间；但读屏器需要它来定位。 -->
        <h1 class="sr-only">{{ currentTabLabel }}</h1>
        <div class="toolbar">
          <el-select v-model="currentProfile" placeholder="选择账户" style="width:220px;" size="default"
                     :loading="profilesLoading" @change="onProfileChange"
                     :disabled="!!lockedProfile">
            <el-option v-for="p in profiles" :key="p.name" :value="p.name"
                       :label="p.name + (p.region ? ' · ' + p.region : '')" />
          </el-select>
          <el-select v-model="compartmentId" placeholder="全部 compartment" style="width:280px;"
                     clearable filterable :loading="compsLoading">
            <el-option v-for="c in compartments" :key="c.id" :value="c.id" :label="c.path" />
          </el-select>
          <el-tooltip content="默认只查租户根。开启后会逐个遍历子 compartment，查询次数成倍增加" placement="bottom">
            <el-checkbox v-model="subtree" label="含子 compartment" />
          </el-tooltip>
          <el-button type="primary" @click="refreshActive" :disabled="loading">
            <svg class="btn-icon" :class="{ spin: loading }" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6" />
            </svg>
            {{ loading ? '刷新中…' : '刷新' }}
          </el-button>
          <span class="who" v-if="loading">正在从 Oracle 拉取…</span>
          <span class="who" v-else-if="lastUpdated">更新于 {{ lastUpdated }}</span>
        </div>

        <el-alert v-if="!profiles.length && !profilesLoading" type="warning" show-icon :closable="false"
                  title="还没有任何账户" description="到「账户配置」粘贴一份 ~/.oci/config 并附上私钥即可开始。" />

        <!-- 单账户实例 -->
        <section class="pane" v-show="activeTab === 'instances'">
          <div class="card">
            <div class="card-head">
              <h2 class="card-title">{{ currentProfile || '未选择账户' }} 的实例</h2>
            </div>

            <!-- 机队额度 -->
            <div class="fleet" v-if="instances.length || usage">
              <div class="meter">
                <div class="meter-head">
                  <span class="meter-k">AMD 微型</span>
                  <span class="meter-v">{{ fleet.amd }}<small>/2 台</small></span>
                </div>
                <div class="bar"><i :style="{ width: (fleet.amd / 2 * 100) + '%' }"></i></div>
              </div>
              <div class="meter">
                <div class="meter-head">
                  <span class="meter-k">ARM OCPU</span>
                  <span class="meter-v">{{ fleet.ocpu }}<small>/4</small></span>
                </div>
                <div class="bar"><i :style="{ width: (fleet.ocpu / 4 * 100) + '%' }"></i></div>
              </div>
              <div class="meter">
                <div class="meter-head">
                  <span class="meter-k">ARM 内存</span>
                  <span class="meter-v">{{ fleet.mem }}<small>/24 GB</small></span>
                </div>
                <div class="bar"><i :style="{ width: (fleet.mem / 24 * 100) + '%' }"></i></div>
              </div>
              <div class="meter">
                <div class="meter-head">
                  <span class="meter-k">免费存储</span>
                  <span class="meter-v">{{ storageUsedGb }}<small>/200 GB</small></span>
                </div>
                <div class="bar" :class="{ warn: typeof storageUsedGb === 'number' && storageUsedGb > 170 }">
                  <i :style="{ width: (typeof storageUsedGb === 'number' ? Math.min(100, storageUsedGb / 200 * 100) : 0) + '%' }"></i>
                </div>
              </div>
            </div>

            <div class="bulkbar" v-if="instSelection.length">
              <span class="count">已选 {{ instSelection.length }} 台</span>
              <el-button size="small" type="success" @click="batchAct(instSelection,'START')">开机</el-button>
              <el-button size="small" @click="batchAct(instSelection,'SOFTSTOP')">关机</el-button>
              <el-button size="small" type="warning" @click="batchAct(instSelection,'SOFTRESET')">重启</el-button>
              <el-button size="small" text @click="clearInstSelection">取消选择</el-button>
            </div>

            <div v-if="loading && !instances.length" aria-label="加载中">
              <div class="skel skel-row" v-for="i in 4" :key="i"></div>
            </div>

            <!-- 实例列表表格 -->
            <div class="table-wrap" v-else-if="instances.length" :class="{ stale: loading }">
              <el-table ref="instTableRef" :data="instances" size="small" stripe border row-key="id"
                        @selection-change="instSelection = $event" style="width:100%;">
                <el-table-column type="selection" width="42" />
                <el-table-column label="状态" width="118">
                  <template #default="{row}">
                    <span class="state">
                      <i :class="['dot', stateTone(row.state)]"></i>
                      <span class="state-label">{{ stateText(row.state) }}</span>
                    </span>
                  </template>
                </el-table-column>
                <el-table-column prop="display_name" label="名称" min-width="118" show-overflow-tooltip />
                <el-table-column label="规格" min-width="140">
                  <template #default="{row}"><span class="mono">{{ specText(row) }}</span></template>
                </el-table-column>
                <!-- 改地址的操作就放在地址旁边，操作列只留开关机，表格才不会宽到被固定列盖住 -->
                <el-table-column label="公网 IP" min-width="180">
                  <template #default="{row}">
                    <div class="ip-stack">
                      <span class="ip-cell">
                        <template v-if="row.public_ip">
                          <span class="mono">{{ row.public_ip }}</span>
                          <button class="copy-btn" @click="copy(row.public_ip)" :aria-label="'复制 ' + row.public_ip">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                          </button>
                          <el-tooltip content="更换公网 IPv4 地址" placement="top">
                            <button class="mini-btn" @click="changeIp(row)" aria-label="更换公网 IP">更换</button>
                          </el-tooltip>
                        </template>
                        <span v-else class="mono" style="color:var(--muted);">无公网 IP</span>
                      </span>
                      <span class="ip-sub mono" v-if="row.private_ip">内网 {{ row.private_ip }}</span>
                    </div>
                  </template>
                </el-table-column>
                <el-table-column label="IPv6" min-width="150">
                  <template #default="{row}">
                    <span class="ip-cell" v-if="row.ipv6">
                      <span class="mono ip-trunc" :title="row.ipv6">{{ row.ipv6 }}</span>
                      <button class="copy-btn" @click="copy(row.ipv6)" :aria-label="'复制 ' + row.ipv6">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                      </button>
                    </span>
                    <el-button v-else size="small" text type="primary" :loading="ipv6Busy === row.id"
                               @click="addIpv6(row)">+ 添加</el-button>
                  </template>
                </el-table-column>
                <el-table-column label="创建时间" width="168">
                  <template #default="{row}"><span class="mono">{{ fmtTime(row.time_created) }}</span></template>
                </el-table-column>
                <el-table-column label="操作" width="316" fixed="right">
                  <template #default="{row}">
                    <div class="row-actions">
                      <el-button size="small" type="primary" plain @click="openDetail(row)"
                                 :loading="isBusy('detail:' + row.id)">详情</el-button>
                      <el-button size="small" type="success" :disabled="!canStart(row)" @click="act(row,'START')">开机</el-button>
                      <el-button size="small" :disabled="!canStop(row)" @click="act(row,'SOFTSTOP')">关机</el-button>
                      <el-button size="small" type="warning" :disabled="!canReset(row)" @click="act(row,'SOFTRESET')">重启</el-button>
                      <el-button size="small" text class="term-btn" @click="terminate(row)">终止</el-button>
                    </div>
                  </template>
                </el-table-column>
              </el-table>
            </div>
            <div class="empty" v-else-if="!loading">
              <b>当前账户下没有实例</b>
            </div>
          </div>
        </section>

        <!-- 新建实例 -->
        <section class="pane" v-show="activeTab === 'create'">
          <div class="card">
            <div class="card-head">
              <h2 class="card-title">新建实例</h2>
            </div>

            <el-alert v-if="opts.needs_network" type="info" show-icon :closable="false"
                      style="margin-bottom:14px;" title="网络基础设施将随首台实例自动就绪" />

            <div class="create-grid">
              <div>
                <el-form label-position="top">
                  <el-form-item label="实例名称">
                    <div style="display:flex; gap:8px; width:100%;">
                      <el-input v-model="createForm.display_name" style="flex:1;" placeholder="例如 payments-api-01" />
                      <el-button @click="rollName" title="重新生成名称">重新生成</el-button>
                    </div>
                  </el-form-item>

                  <el-form-item label="规格">
                    <div class="seg" role="group" aria-label="规格">
                      <button v-for="s in opts.shapes" :key="s.shape" type="button"
                              :class="{ on: createForm.shape === s.shape }"
                              :aria-pressed="createForm.shape === s.shape"
                              @click="pickShape(s)">{{ s.label }}</button>
                    </div>
                  </el-form-item>

                  <template v-if="isArm">
                    <el-form-item :label="'OCPU：' + createForm.ocpus + ' 核'">
                      <el-slider v-model="createForm.ocpus" :min="1" :max="4" :step="1"
                                 show-stops @change="onOcpuChange" style="width:100%;" />
                    </el-form-item>
                    <el-form-item :label="'内存：' + createForm.memory_gb + ' GB'">
                      <el-slider v-model="createForm.memory_gb" :min="1" :max="24" :step="1"
                                 @change="runPreflight" style="width:100%;" />
                    </el-form-item>
                  </template>
                  <el-form-item v-else label="规格配置">
                    <span class="mono" style="color:var(--muted);">1 OCPU / 1 GB</span>
                  </el-form-item>

                  <el-form-item :label="'引导卷：' + createForm.boot_gb + ' GB'">
                    <el-slider v-model="createForm.boot_gb" :min="50" :max="200" :step="5"
                               @change="runPreflight" style="width:100%;" />
                  </el-form-item>

                  <el-form-item label="可用域">
                    <el-select v-model="createForm.availability_domain" style="width:100%;"
                               placeholder="选择可用域">
                      <el-option v-for="ad in opts.availability_domains" :key="ad" :value="ad" :label="ad" />
                    </el-select>
                  </el-form-item>

                  <el-form-item label="系统镜像">
                    <el-select v-model="createForm.image_id" style="width:100%;" filterable
                               :loading="optsLoading" placeholder="选择镜像">
                      <el-option v-for="im in opts.images" :key="im.id" :value="im.id"
                                 :label="im.display_name" />
                    </el-select>
                  </el-form-item>

                  <el-form-item label="网络">
                    <div style="width:100%;">
                      <el-checkbox v-model="createForm.assign_ipv6" label="分配 IPv6 地址" />
                      <el-checkbox v-model="createForm.open_all_ports" label="放行所有端口" />
                    </div>
                  </el-form-item>

                  <el-form-item label="登录方式">
                    <div style="width:100%;">
                      <el-checkbox v-model="createForm.use_password"
                                   label="启用 root 密码登录" />
                      <div v-if="createForm.use_password" style="margin-top:8px;">
                        <div style="display:flex; gap:8px; align-items:center;">
                          <el-input v-model="createForm.root_password" class="mono"
                                    placeholder="至少 12 位" show-password style="flex:1;" />
                          <el-button size="small" @click="rollRootPassword">随机生成</el-button>
                          <el-button size="small" :disabled="!createForm.root_password"
                                     @click="copy(createForm.root_password)">复制</el-button>
                        </div>
                      </div>
                    </div>
                  </el-form-item>

                  <el-form-item label="SSH 公钥">
                    <div style="width:100%;">
                      <div style="display:flex; gap:8px; margin-bottom:8px; align-items:center;">
                        <el-select v-model="selectedKeyId" placeholder="从公钥池快速选择" style="flex:1;" clearable @change="onSelectKeyFromVault">
                          <el-option v-for="k in sshKeys" :key="k.id" :value="k.id" :label="k.name + ' (' + (k.key_type || 'SSH') + ')'" />
                        </el-select>
                        <el-button size="small" @click="$refs.pubkeyInput.click()">从文件导入</el-button>
                        <input ref="pubkeyInput" type="file" accept=".pub,.txt,text/plain"
                               style="display:none;" @change="onPubKeyFile" />
                      </div>
                      <el-input v-model="createForm.ssh_public_key" type="textarea" :rows="3" class="mono"
                                placeholder="ssh-ed25519 AAAA... 或 ssh-rsa AAAA..." />
                    </div>
                  </el-form-item>
                </el-form>
              </div>

              <!-- 额度预检 -->
              <div>
                <div class="pf-card" :class="preflight && preflight.allow ? 'ok' : (preflight ? 'bad' : '')">
                  <div class="pf-head">
                    <h2 class="card-title">额度预检</h2>
                    <span class="state" v-if="preflight">
                      <i :class="['dot', preflight.allow ? 'ok' : 'crit']"></i>
                      <span class="state-label">{{ preflight.allow ? '可以创建' : '超出额度' }}</span>
                    </span>
                    <span class="who" v-else-if="preflightLoading">核算中…</span>
                  </div>

                  <template v-if="preflight">
                    <div class="pf-row" v-for="c in preflight.checks" :key="c.key">
                      <i :class="['dot', c.ok ? 'ok' : 'crit']"></i>
                      <span class="pf-label">{{ c.label }}</span>
                      <span class="pf-calc mono">
                        {{ c.current }} <em>+{{ c.adding }}</em> = <b>{{ c.after }}</b> / {{ c.limit }}{{ c.unit }}
                      </span>
                    </div>

                    <div class="pf-msg crit" v-for="(b,i) in preflight.blockers" :key="'b'+i">{{ b }}</div>
                    <div class="pf-msg warn" v-for="(w,i) in preflight.warnings" :key="'w'+i">{{ w }}</div>
                  </template>
                  <div class="empty" v-else-if="!preflightLoading" style="padding:20px 8px;">
                    填好规格后自动核算
                  </div>
                </div>

                <el-button type="primary" size="large" style="width:100%; margin-top:14px;"
                           :disabled="!canCreate" :loading="creating" @click="createInstance">
                  {{ preflight && !preflight.allow ? '超出免费额度，无法创建' : '创建实例' }}
                </el-button>
                <p class="create-step" v-if="creating && createStep">
                  <i class="dot warn"></i><span>{{ createStep }}</span>
                </p>
              </div>
            </div>
          </div>
        </section>

        <!-- 免费额度 -->
        <section class="pane" v-show="activeTab === 'usage'">
          <div class="card">
            <div class="card-head">
              <h2 class="card-title">账户等级</h2>
              <el-button size="small" @click="loadTier(true)" :loading="tierLoading">
                {{ tier.tier ? '重新检测' : '检测' }}
              </el-button>
            </div>

            <div class="kv" v-if="tier.tier">
              <span class="state">
                <i :class="['dot', tierDotOf(tier)]"></i>
                <span class="state-label" style="font-size:13px;">{{ tier.label }}</span>
              </span>
              <span class="who">{{ (tier.reasons || [])[0] }}</span>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <h2 class="card-title">当月出网流量</h2>
              <el-button size="small" @click="loadEgress(true)" :loading="egressLoading">
                {{ egress.egress_gb === undefined ? '查询' : '重新查询' }}
              </el-button>
            </div>
            <template v-if="egress.egress_gb !== undefined">
              <div class="quota">
                <div class="label">出网流量（{{ egress.region }}）</div>
                <div :class="['bar', egress.percent >= 100 ? 'over' : (egress.percent >= 80 ? 'warn' : '')]">
                  <i :style="{ width: Math.min(egress.percent, 100) + '%' }"></i>
                </div>
                <div class="val mono">{{ fmtGb(egress.egress_gb) }} / 10 TB</div>
              </div>
              <p class="hint" v-if="egress.error" style="color:var(--crit);">{{ egress.error }}</p>
            </template>
          </div>

          <div class="card" v-if="loading && !usage" aria-label="加载中">
            <div class="skel skel-row" v-for="i in 6" :key="i"></div>
          </div>
          <div class="card" v-else-if="usage">
            <div class="card-head">
              <h2 class="card-title">当前用量 / Always Free 上限</h2>
            </div>
            <el-alert v-for="(w,i) in usage.warnings" :key="i" type="error" show-icon :closable="false"
                      :title="w" style="margin-bottom:8px;" />
            <div class="quota" v-for="it in usage.items" :key="it.label">
              <div class="label">{{ it.label }}</div>
              <div :class="['bar', it.over ? 'over' : (it.percent >= 80 ? 'warn' : '')]">
                <i :style="{ width: Math.min(it.percent,100) + '%' }"></i>
              </div>
              <div class="num"><b>{{ it.used }}</b> / {{ it.limit }} {{ it.unit }}</div>
            </div>
          </div>
          <div class="card empty" v-else-if="!loading">
            <b>暂无额度数据</b>
          </div>
        </section>

        <!-- 存储 -->
        <section class="pane" v-show="activeTab === 'storage'">
          <div class="card">
            <div class="card-head">
              <h2 class="card-title">卷与 200GB 额度</h2>
              <el-button size="small" @click="loadStorage" :loading="storageLoading">刷新</el-button>
            </div>

            <div v-if="storageLoading && !storage" aria-label="加载中">
              <div class="skel skel-row" v-for="i in 4" :key="i"></div>
            </div>
            <template v-else-if="storage">
              <div class="stats" style="margin-bottom:14px;">
                <div class="stat" :class="storage.summary.total_gb > storage.summary.limit_gb ? 'crit' : ''">
                  <div class="v">{{ storage.summary.total_gb }}</div>
                  <div class="k">已用 GB / {{ storage.summary.limit_gb }}</div>
                </div>
                <div class="stat"><div class="v">{{ storage.summary.boot_count }}</div><div class="k">引导卷</div></div>
                <div class="stat"><div class="v">{{ storage.summary.block_count }}</div><div class="k">块存储卷</div></div>
                <div class="stat" :class="storage.summary.orphan_count ? 'crit' : 'idle'">
                  <div class="v">{{ storage.summary.orphan_gb }}</div>
                  <div class="k">未挂载卷占用 GB</div>
                </div>
              </div>

              <el-alert v-if="storage.summary.orphan_count" type="warning" show-icon :closable="false"
                        style="margin-bottom:12px;"
                        :title="'检测到 ' + storage.summary.orphan_count + ' 个未挂载卷（' + storage.summary.orphan_gb + ' GB）'" />

              <div class="table-wrap" v-if="storage.volumes.length">
                <el-table :data="storage.volumes" size="small" stripe border style="width:100%;"
                          :row-class-name="volRowClass">
                  <el-table-column label="挂载" width="150">
                    <template #default="{row}">
                      <span class="state">
                        <i :class="['dot', row.orphan ? 'crit' : 'ok']"></i>
                        <span class="state-label">{{ row.orphan ? '未挂载' : (row.attached_to || '已挂载') }}</span>
                      </span>
                    </template>
                  </el-table-column>
                  <el-table-column prop="display_name" label="名称" min-width="170" show-overflow-tooltip />
                  <el-table-column label="类型" width="90">
                    <template #default="{row}">{{ row.kind === 'boot' ? '引导卷' : '块存储' }}</template>
                  </el-table-column>
                  <el-table-column label="大小" width="90">
                    <template #default="{row}"><span class="mono">{{ row.size_gb }} GB</span></template>
                  </el-table-column>
                  <el-table-column label="性能 (VPU/GB)" width="210">
                    <template #default="{row}">
                      <div class="vpu-cell">
                        <el-input-number :model-value="row.vpus_per_gb" size="small"
                                         :min="vpuRange.min" :max="vpuRange.max" :step="vpuRange.step"
                                         step-strictly controls-position="right" style="width:110px;"
                                         @change="v => changePerformance(row, v)" />
                        <span class="vpu-tier" :class="{ paid: row.vpus_per_gb > vpuRange.free_max }">
                          {{ vpuTier(row.vpus_per_gb) }}
                        </span>
                      </div>
                    </template>
                  </el-table-column>
                  <el-table-column label="创建于" width="110">
                    <template #default="{row}"><span class="mono">{{ fmtDate(row.time_created) }}</span></template>
                  </el-table-column>
                  <el-table-column label="操作" width="100" fixed="right">
                    <template #default="{row}">
                      <el-button size="small" type="danger" :disabled="!row.orphan"
                                 @click="deleteVolume(row)">删除</el-button>
                    </template>
                  </el-table-column>
                </el-table>
              </div>
              <div class="empty" v-else><b>当前账户下没有卷</b></div>
            </template>
            <div class="empty" v-else-if="!storageLoading"><b>暂无存储数据</b></div>
          </div>
        </section>

        <!-- 防火墙 -->
        <section class="pane" v-show="activeTab === 'firewall'">
          <div class="card">
            <div class="card-head">
              <h2 class="card-title">云端防火墙（安全列表）</h2>
            </div>
            <div class="toolbar">
              <el-select v-model="fwInstance" placeholder="选择实例" style="width:280px;" @change="loadFirewall">
                <el-option v-for="i in instances" :key="i.id" :value="i.id"
                           :label="i.display_name + (i.public_ip ? ' · ' + i.public_ip : '')" />
              </el-select>
              <el-button @click="loadFirewall" :loading="fwLoading" :disabled="!fwInstance">刷新</el-button>
            </div>

            <template v-if="firewall">
              <div class="fw-verdict" :class="firewall.all_open_v4 ? 'open' : 'partial'">
                <i :class="['dot', firewall.all_open_v4 ? 'warn' : 'ok']"></i>
                <div>
                  <b>{{ firewall.verdict }}</b>
                  <span class="mono">子网 {{ firewall.subnet_name }}
                    · IPv6 {{ firewall.ipv6_enabled ? '已开通' : '未开通' }}</span>
                </div>
                <div class="fw-actions">
                  <el-button v-if="!firewall.all_open_v4" type="warning" :loading="fwBusy"
                             @click="allowAll">放行全部端口</el-button>
                  <el-button v-else type="primary" plain :loading="fwBusy"

        <!-- 监控 -->
        <section class="pane" v-show="activeTab === 'metrics'">

              </div>
              <div class="chart" @mousemove="onChartMove" @mouseleave="hoverIdx = -1">
                <svg :viewBox="'0 0 ' + CW + ' ' + CH" role="img"
                     :aria-label="'过去 ' + metricHours + ' 小时的 CPU 与内存利用率折线图'">
                  <line class="grid" v-for="g in gridLines" :key="g.y" x1="46" :y1="g.y" :x2="CW-8" :y2="g.y" />
                  <text class="axis-t" v-for="g in gridLines" :key="'t'+g.y" x="40" :y="g.y+3" text-anchor="end">{{ g.label }}</text>
                  <path v-for="s in areaSeries" :key="'a'+s.metric" :d="s.area" :fill="s.color" fill-opacity="0.16" />
                  <path v-for="s in chartSeries" :key="'l'+s.metric" :d="s.line" fill="none" :stroke="s.color"
                        stroke-width="1.8" :stroke-dasharray="s.dash ? '5 4' : ''" vector-effect="non-scaling-stroke"
                        stroke-linejoin="round" />

                        stroke="#b04f2d" stroke-dasharray="3 3" />

                  <text class="axis-t" :x="CW-8" :y="CH-6" text-anchor="end">{{ axisEnd }}</text>
                </svg>
                <div class="readout" v-if="hoverIdx >= 0">
                  <div style="color:var(--muted);">{{ hoverTime }}</div>

                    {{ s.name }} {{ hoverValue(s) }}

            <div class="table-wrap" style="margin-top:16px;" v-if="metrics.length">

                </el-table-column>
                <el-table-column label="区域" width="126">

                <el-table-column label="操作" width="298" fixed="right">
                  <template #default="{row}">

                </el-form-item>

              <el-button type="primary" @click="importProfile" :loading="importing">导入并校验</el-button>
            </div>
          </div>

// 本地资源优先；下不到再退到公共 CDN，保证离线构建和本地开发都能起来。
(function () {
  var CDN = {
    'vue.global.prod.js': ['https://unpkg.com/vue@3/dist/vue.global.prod.js',
                           'https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js'],
    'element-plus.full.min.js': ['https://unpkg.com/element-plus/dist/index.full.min.js',
                                 'https://cdn.jsdelivr.net/npm/element-plus/dist/index.full.min.js'],
    'axios.min.js': ['https://unpkg.com/axios/dist/axios.min.js',
                     'https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js'],
    'element-plus.css': ['https://unpkg.com/element-plus/dist/index.css'],
    'element-plus-dark.css': ['https://unpkg.com/element-plus/theme-chalk/dark/css-vars.css']
  };
  function loadScript(url) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = url; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  function chain(urls) {
    return urls.reduce(function (p, u) {
      return p.catch(function () { return loadScript(u); });
    }, Promise.reject());
  }
  function loadStyle(url) {
    return new Promise(function (res) {
      var l = document.createElement('link');
      l.rel = 'stylesheet'; l.href = url;
      l.onload = res; l.onerror = res;   // 样式挂了也别卡住启动
      document.head.appendChild(l);
    });
  }
  // 探针：Element Plus 给 .el-button 的 display 是 inline-flex，
  // 拿到别的值就说明它的样式压根没加载。
  function stylesMissing() {
    var probe = document.createElement('div');
    probe.className = 'el-button';
    probe.style.position = 'absolute';
    probe.style.visibility = 'hidden';
    document.documentElement.appendChild(probe);
    var display = getComputedStyle(probe).display;
    probe.remove();
    return display !== 'inline-flex';
  }
  window.__ocixBoot = (async function () {
    for (var name of ['vue.global.prod.js', 'element-plus.full.min.js', 'axios.min.js']) {
      try { await loadScript('/assets/' + name); } catch (e) { await chain(CDN[name]); }
    }
    // 本地样式没下到时补 CDN 样式。
    // 注意别用 link.sheet 判断：本地文件 404 时它依然是个非空对象，
    // 这个判断永远为真，等于回退从来不生效，缺资源时整个面板是裸样式的。
    // 只能实际量一下样式有没有生效。
    if (stylesMissing()) {
      await Promise.all(['element-plus.css', 'element-plus-dark.css'].map(function (n) {
        return loadStyle(CDN[n][0]);
      }));
    }
  })();
})();
</script>

// 生成像真实项目的实例名，而不是 instance-20240101
const NAME_DOMAIN = ['payments', 'orders', 'search', 'media', 'notify', 'billing', 'analytics',
  'identity', 'inventory', 'chat', 'ledger', 'catalog', 'session', 'webhook', 'report'];
const NAME_ROLE = ['api', 'worker', 'gateway', 'cache', 'proxy', 'edge', 'relay', 'queue',
  'sync', 'ingest', 'render', 'cron'];
const NAME_ENV = ['prod', 'stg', 'live', 'core', 'main'];
function randomName() {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const nn = String(Math.floor(Math.random() * 8) + 1).padStart(2, '0');
  const d = pick(NAME_DOMAIN), r = pick(NAME_ROLE);
  switch (Math.floor(Math.random() * 3)) {
    case 0: return `${d}-${r}-${nn}`;
    case 1: return `${d}-${r}-${pick(NAME_ENV)}`;
    default: return `${r}-${d}-${nn}`;
  }
}

/* ── 登录页的星球场景 ──
   手写 canvas，不引第三方 3D 库。面板是单文件、无构建、CDN 挂了要能退化到
   最低限度可用，为一个登录页背景再拖进来几百 KB 的 3D 引擎不划算——
   这里要的东西（球面点阵 + 大圆弧 + 沿弧飞的光点）自己算不到两百行。

   画的是真东西：下面每一个坐标都是 Oracle 真实存在的区域，
   飞来飞去的光点是区域之间的链路，跑完一趟会把链路名写到底部状态条上。 */
const OcixScene = (() => {
  // [区域名, 纬度, 经度] —— 都是 OCI 实际开放的商业区域
  const REGIONS = [
    ['us-ashburn-1',    39.04,  -77.49], ['us-phoenix-1',    33.45, -112.07],
    ['us-sanjose-1',    37.34, -121.89], ['ca-toronto-1',    43.65,  -79.38],
    ['sa-saopaulo-1',  -23.55,  -46.63], ['uk-london-1',     51.51,   -0.13],
    ['eu-frankfurt-1',  50.11,    8.68], ['eu-zurich-1',     47.38,    8.54],
    ['me-dubai-1',      25.20,   55.27], ['ap-mumbai-1',     19.08,   72.88],
    ['ap-singapore-1',   1.35,  103.82], ['ap-tokyo-1',      35.68,  139.69],
    ['ap-osaka-1',      34.69,  135.50], ['ap-sydney-1',    -33.87,  151.21],
  ];

  const toVec = (lat, lon) => {
    const p = lat * Math.PI / 180, l = lon * Math.PI / 180, c = Math.cos(p);
    return [c * Math.sin(l), Math.sin(p), c * Math.cos(l)];
  };
  const rotY = (v, a) => {
    const s = Math.sin(a), c = Math.cos(a);
    return [v[0] * c + v[2] * s, v[1], v[2] * c - v[0] * s];
  };
  // 球面线性插值：两点之间沿大圆走，这才是链路在球面上的真实走法
  const slerp = (a, b, t) => {
    let d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    d = Math.max(-1, Math.min(1, d));
    const w = Math.acos(d);
    if (w < 1e-6) return a.slice();
    const sw = Math.sin(w), k0 = Math.sin((1 - t) * w) / sw, k1 = Math.sin(t * w) / sw;
    return [a[0] * k0 + b[0] * k1, a[1] * k0 + b[1] * k1, a[2] * k0 + b[2] * k1];
  };

  let canvas, ctx, raf = 0, w = 0, h = 0, dpr = 1;
  let dots = [], nodes = [], flights = [], spin = 0, last = 0, ro = null;
  let onFlow = null, still = false;

  function layout() {
    const wide = w > 900;
    return {
      cx: wide ? w * 0.68 : w * 0.5,
      cy: wide ? h * 0.5 : h * 0.32,
      R: wide ? Math.min(w * 0.26, h * 0.42) : Math.min(w * 0.42, h * 0.26),
    };
  }

  // 透视投影：相机在 +Z，越靠近越大越亮。depth 用来做前后遮挡的近似。
  function project(v, L) {
    const D = 3.2;                       // 相机距离，单位是球半径
    const persp = D / (D - v[2]);
    return { x: L.cx + v[0] * L.R * persp, y: L.cy - v[1] * L.R * persp,
             z: v[2], s: persp };
  }

  function seed() {
    // 斐波那契球：点在球面上分布得最匀，不会像经纬网格那样在两极堆成一团
    const n = w < 700 ? 260 : 620;
    const ga = Math.PI * (3 - Math.sqrt(5));
    dots = [];
    for (let i = 0; i < n; i++) {
      const y = 1 - (i / (n - 1)) * 2;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const th = ga * i;
      dots.push([Math.cos(th) * r, y, Math.sin(th) * r]);
    }
    nodes = REGIONS.map(([name, lat, lon]) => ({ name, v: toVec(lat, lon) }));
    flights = [];
    for (let i = 0; i < (w < 700 ? 7 : 13); i++) flights.push(newFlight(Math.random()));
  }

  function newFlight(t0) {
    let i = (Math.random() * nodes.length) | 0, j = (Math.random() * nodes.length) | 0;
    while (j === i) j = (Math.random() * nodes.length) | 0;
    // 原来一趟要飞 4~10 秒，太拖。现在 2~4 秒穿一次，才像在传数据。
    return { i, j, t: t0 || 0, speed: 0.24 + Math.random() * 0.26, announced: false };
  }

  function draw(dt) {
    const L = layout();
    ctx.clearRect(0, 0, w, h);

    // 球体本身：一层极淡的辉光，让球有体积感而不是一堆浮点
    const g = ctx.createRadialGradient(L.cx, L.cy, L.R * 0.1, L.cx, L.cy, L.R * 1.25);
    g.addColorStop(0, 'rgba(176,79,45,0.10)');
    g.addColorStop(0.55, 'rgba(176,79,45,0.04)');
    g.addColorStop(1, 'rgba(176,79,45,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(L.cx, L.cy, L.R * 1.25, 0, Math.PI * 2); ctx.fill();

    // 点阵。背面的点压暗但不删——留着才有「透过球看到另一面」的感觉
    for (let k = 0; k < dots.length; k++) {
      const pt = project(rotY(dots[k], spin), L);
      const front = pt.z > 0;
      const a = front ? 0.24 + pt.z * 0.55 : 0.07 + (1 + pt.z) * 0.08;
      ctx.fillStyle = 'rgba(143,138,125,' + a.toFixed(3) + ')';
      const r = (front ? 1.15 : 0.8) * pt.s * 0.62;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2); ctx.fill();
    }

    // 链路与数据包
    for (const f of flights) {
      const A = rotY(nodes[f.i].v, spin), B = rotY(nodes[f.j].v, spin);
      const STEPS = 34;
      // 弧线抬离球面，中间最高——两点越远抬得越高，跟真实的大圆航线一个道理
      const lift = (t) => 1 + 0.30 * Math.sin(Math.PI * t);
      ctx.beginPath();
      let started = false;
      for (let k = 0; k <= STEPS; k++) {
        const t = k / STEPS, m = slerp(A, B, t), lf = lift(t);
        const pt = project([m[0] * lf, m[1] * lf, m[2] * lf], L);
        if (m[2] < -0.15) { started = false; continue; }   // 绕到球背面就断开
        if (!started) { ctx.moveTo(pt.x, pt.y); started = true; }
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.strokeStyle = 'rgba(176,79,45,0.26)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 包头 + 拖尾。拖尾就是把前面几个时刻的位置画成渐隐的点
      for (let q = 0; q < 12; q++) {
        const t = f.t - q * 0.019;
        if (t < 0 || t > 1) continue;
        const m = slerp(A, B, t), lf = lift(t);
        const pt = project([m[0] * lf, m[1] * lf, m[2] * lf], L);
        if (m[2] < -0.1) continue;
        const fade = (1 - q / 12);
        ctx.fillStyle = q === 0
          ? 'rgba(59,57,49,' + (1 * fade).toFixed(3) + ')'
          : 'rgba(201,106,69,' + (0.7 * fade * fade).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, (q === 0 ? 2.9 : 1.8) * pt.s * 0.75, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 区域节点：正面的画成小圈，背面的不画
    for (const nd of nodes) {
      const v = rotY(nd.v, spin);
      if (v[2] <= 0.02) continue;
      const pt = project(v, L);
      const fl = nd.flash || 0;
      const a = Math.min(1, 0.34 + v[2] * 0.55 + fl * 0.5);
      ctx.fillStyle = fl > 0.02
        ? 'rgba(' + (95 + 130 * fl).toFixed(0) + ',' + (168 + 70 * fl).toFixed(0) + ',' +
          (181 + 60 * fl).toFixed(0) + ',' + a.toFixed(3) + ')'
        : 'rgba(176,79,45,' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(pt.x, pt.y, (1.9 + fl * 1.6) * pt.s * 0.8, 0, Math.PI * 2); ctx.fill();
      // 抵达时向外扩一圈，扩完就没——和状态点的脉冲同一个语汇
      ctx.strokeStyle = 'rgba(176,79,45,' + (a * (0.32 + fl * 0.5)).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, (5.2 + fl * 9) * pt.s * 0.8, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function step(now) {
    raf = requestAnimationFrame(step);
    if (document.hidden) { last = now; return; }
    const dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    // 0.075 rad/s 是 84 秒转一圈——盯着看也觉得没动。
    // 0.26 rad/s 约 24 秒一圈，明显在转，又不到晃眼的地步。
    spin += dt * 0.26;
    for (const nd of nodes) if (nd.flash) nd.flash = Math.max(0, nd.flash - dt * 1.6);
    for (const f of flights) {
      f.t += dt * f.speed;
      if (f.t >= 1) {
        // 跑完一趟：把这条链路写到底部，然后换一对区域重开
        if (onFlow) onFlow(nodes[f.i].name, nodes[f.j].name);
        nodes[f.j].flash = 1;          // 抵达：目标区域闪一下，眼睛能跟上「到了」
        Object.assign(f, newFlight(0));
      }
    }
    draw(dt);
  }

  function resize() {
    if (!canvas) return;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    // clientWidth 在元素刚插入、还没走过一次布局时可能是 0。
    // 拿 0 去设 canvas.width，画布就是 0×0——后面画什么都不出现，
    // 而且一声不吭：控制台没有报错，页面看起来就是「背景完全没动」。
    // 所以逐级兜底，并且下面还挂了 ResizeObserver，等它真拿到尺寸再补一次。
    const nw = canvas.clientWidth
      || (canvas.parentElement && canvas.parentElement.clientWidth)
      || window.innerWidth || 0;
    const nh = canvas.clientHeight
      || (canvas.parentElement && canvas.parentElement.clientHeight)
      || window.innerHeight || 0;
    if (!nw || !nh) return;                 // 还是量不到就等下一次，别把画布清成 0
    if (nw === w && nh === h && canvas.width) return;   // 尺寸没变就别重置粒子
    w = nw; h = nh;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed();
    if (still) draw(0);
  }

  return {
    start(el, flowCb) {
      if (!el || raf) return;
      canvas = el; ctx = canvas.getContext('2d'); onFlow = flowCb || null;
      still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      resize();
      window.addEventListener('resize', resize);
      // 元素拿到真实尺寸的那一刻再补一次——上面那次可能赶在布局之前
      if (window.ResizeObserver) {
        ro = new ResizeObserver(resize);
        ro.observe(canvas);
      }
      // 关掉动效的人只给一帧静止的星球，不起循环
      if (still) { draw(0); return; }
      last = performance.now();
      raf = requestAnimationFrame(step);
    },
    stop() {
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      window.removeEventListener('resize', resize);
      if (ro) { ro.disconnect(); ro = null; }
      canvas = null; ctx = null; dots = []; nodes = []; flights = [];
      w = 0; h = 0;
    },
  };
})();
