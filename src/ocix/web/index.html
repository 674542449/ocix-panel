    const netBusy = ref(false);
    let inflight = 0;
    const settle = () => {
      inflight = Math.max(0, inflight - 1);
      if (!inflight) netBusy.value = false;
    };
    axios.interceptors.request.use((cfg) => { inflight++; netBusy.value = true; return cfg; });
    axios.interceptors.response.use(
      (r) => { settle(); serviceOk.value = true; serviceHint.value = '与面板后端通信正常'; return r; },
      (e) => {
        settle();
        const st = e.response && e.response.status;
        if (!e.response) {
          serviceOk.value = false; serviceHint.value = '连不上面板后端，可能正在重启';
        } else if (st >= 500) {
          serviceOk.value = false; serviceHint.value = '后端返回 ' + st;
        }
        return Promise.reject(e);
      });

    function applyToken(t) {

    const errMsg = (e, fallback) => {
      const d = e && e.response && e.response.data && e.response.data.detail;
      if (!d) return fallback;
      if (typeof d === 'string') return d;
      // 后端已把校验错误拍平成字符串，这里只是兜底：
      // 真拿到数组还直接塞进弹窗的话，用户看到的是 [object Object]
      if (Array.isArray(d)) {
        const s = d.map(x => (x && x.msg) || '').filter(Boolean).join('；');
        return s || fallback;
      }
      return d.msg || fallback;
    };

    const createStep = ref('');

    async function pollJob(jobId, everyMs = 1500) {
      const sleep = (ms) => new Promise(r => setTimeout(r, ms));
      for (;;) {
        const { data } = await axios.get('/api/provision/jobs/' + jobId);
        const steps = data.steps || [];
        if (steps.length) {
          createStep.value = steps[steps.length - 1].text + '（已用 ' + data.elapsed + 's）';
        }
        if (data.state === 'ok') return data.result;
        if (data.state === 'failed') {
          const err = new Error((data.error && data.error.message) || '创建失败');
          err.jobError = data.error;
          throw err;
        }
        await sleep(everyMs);
      }
    }

    function rollRootPassword() {

      const buf = new Uint32Array(20);

    async function createInstance() {
      const p = preflight.value;

            : ''),

          { type: 'info', confirmButtonText: '创建', cancelButtonText: '取消',
            customStyle: { whiteSpace: 'pre-wrap' } });
      } catch { return; }

      creating.value = true;
      try {
        // 后端立刻返回任务号，活儿在它那边的后台线程里跑。
        // 之前是同步等的：整条链路一分多钟起步，挂在 Cloudflare 后面
        // 100 秒就被判超时，返回一个「源站」错误页——而实例其实已经建出来了。
        const { data: sub } = await axios.post('/api/provision/instances', {
          profile: currentProfile.value,
          compartment_id: compartmentId.value || (compartments.value[0] || {}).id,
          display_name: createForm.display_name,
          availability_domain: createForm.availability_domain,
          image_id: createForm.image_id,
          shape: createForm.shape,
          ocpus: createForm.ocpus,
          memory_gb: createForm.memory_gb,
          boot_gb: createForm.boot_gb,
          ssh_public_key: createForm.ssh_public_key,
          root_password: createForm.use_password ? createForm.root_password : '',
          assign_ipv6: createForm.assign_ipv6,
          open_all_ports: createForm.open_all_ports,
        });
        const data = await pollJob(sub.job_id);
        ElMessage.success(`${data.display_name} 已创建，正在初始化`);
        const lines = [];
        if (data.network_created) lines.push('已自动创建 VCN + 网关 + 公共子网');
        if (data.ports_opened) lines.push('已放行子网全部入站端口');
        if (data.ipv6) lines.push(`IPv6 地址 ${data.ipv6}`);
        lines.push('登录： ssh ubuntu@公网IP');
        if ((data.warnings || []).length) {
          ElMessageBox.alert(
            lines.join('\n') + '\n\n以下步骤未能自动完成：\n· ' + data.warnings.join('\n· '),
            `${data.display_name} 已创建，但有几项需手动处理`,
            { type: 'warning', customStyle: { whiteSpace: 'pre-wrap', maxWidth: '620px' } });
        } else {
          ElMessageBox.alert(lines.join('\n'), `${data.display_name} 创建完成`,
            { type: 'success', customStyle: { whiteSpace: 'pre-wrap', maxWidth: '560px' } });
        }
        createForm.display_name = randomName();
        activeTab.value = 'instances';
        await loadSingle();
        doPreflight();
      } catch (e) {
        // 额度被拦下时给的是结构化原因，逐条列出来比一句「创建失败」有用。
        // 现在这个原因是从任务结果里回来的，不再是 HTTP 的 detail。
        const d = (e && e.jobError) || (e.response && e.response.data && e.response.data.detail);
        if (d && typeof d === 'object' && d.blockers) {
          ElMessageBox.alert(d.blockers.join('\n'), '超出免费额度，已阻止创建',
            { type: 'error', customStyle: { whiteSpace: 'pre-wrap' } });
        } else {
          ElMessageBox.alert((d && d.message) || errMsg(e, '创建失败'), '创建失败',
            { type: 'error', customStyle: { whiteSpace: 'pre-wrap', maxWidth: '560px' } });
        }
      } finally { creating.value = false; createStep.value = ''; }
    }

      if (name === 'usage') loadEgress(false);

        if (!instances.value.length) loadSingle();

    async function batchAct(rows, action) {
      const label = ACTION_LABEL[action] || action;
      const targets = rows.map(r => ({
        profile: r.profile || currentProfile.value,
        instance_id: r.id,
        display_name: r.display_name,
      }));
      try {
        await ElMessageBox.confirm(
          `对选中的 ${targets.length} 台实例执行${label}？`, `确认批量${label}`,
          { type: 'warning', confirmButtonText: `${label} ${targets.length} 台`, cancelButtonText: '取消' });
      } catch { return; }
      loading.value = true;
      try {
        const { data } = await axios.post('/api/instances/batch-action', { action, targets });
        if (data.failed === 0) {
          ElMessage.success(`${targets.length} 台已发送${label}指令`);
        } else {
          const bad = data.results.filter(r => !r.ok);
          ElMessageBox.alert(
            bad.map(r => `${r.display_name || r.instance_id}：${r.error}`).join('\n'),
            `${data.succeeded} 台成功，${data.failed} 台失败`,
            { type: 'warning', customStyle: { whiteSpace: 'pre-wrap', maxWidth: '560px' } });
        }
        clearInstSelection();
        await refreshAfterAction();
      } catch (e) {
        ElMessage.error(errMsg(e, `批量${label}失败`));
      } finally { loading.value = false; }

    const updRunning = computed(() =>
      upd.value.state === 'running' || upd.value.state === 'pending' || upd.value.queued);
    const updStateText = computed(() => ({
      pending: '排队中', running: '更新中', done: '已完成', failed: '失败',
    }[upd.value.state] || ''));
    const updTagType = computed(() => ({
      done: 'success', failed: 'danger', running: 'warning', pending: 'info',
    }[upd.value.state] || 'info'));

    async function loadUpdateStatus() {
      try {
        const { data } = await axios.get('/api/system/update/status');
        const wasRunning = updRunning.value;
        upd.value = data;
        // 跑完了就把轮询停掉，别一直挂着
        if (wasRunning && !updRunning.value) watchUpdate(false);
        // 更新完成后版本号变了，把版本卡片一起刷新
        if (wasRunning && !updRunning.value) {
          if (data.state === 'done') ElMessage.success(`已更新到 v${data.version}`);
          if (data.state === 'failed') ElMessage.error('更新失败，展开日志看原因');
          loadSystem(false);
        }
      } catch (e) {
        // 更新时容器正在重启，请求失败是预期内的，别弹错误吓人
      }
    }

    function watchUpdate(on) {
      if (updTimer) { clearInterval(updTimer); updTimer = null; }
      if (on) updTimer = setInterval(loadUpdateStatus, 3000);
    }

    async function doUpdate() {
      try {
        await ElMessageBox.confirm(
          '现在更新到最新版？\n' +
          '过程中面板会重启，大约需要一两分钟。配置、密码和审计记录都不会动。',
          '确认更新',
          { type: 'warning', confirmButtonText: '开始更新', cancelButtonText: '再想想',
            customStyle: { whiteSpace: 'pre-wrap' } });
      } catch { return; }
      updBusy.value = true;
      try {
        const { data } = await axios.post('/api/system/update');
        upd.value = { ...upd.value, state: data.state, message: data.msg };
        ElMessage.success(data.msg);
        watchUpdate(true);
      } catch (e) {
        ElMessage.error(errMsg(e, '发起更新失败'));
      } finally { updBusy.value = false; }
    }

    // paid 用橙色（要花钱，值得注意）、free 绿色、未知灰色，
    // 和全站其它状态点保持同一套语义
    const TIER_DOT = { paid: 'attn', free: 'ok', unknown: 'idle' };
    const TIER_SHORT = { paid: '已升级', free: '免费', unknown: '未知' };
    const tierDotOf = (t) => TIER_DOT[t && t.tier] || 'idle';
    const tierDot = (name) => {
      const t = tiers.value[name];
      return t ? (TIER_DOT[t.tier] || 'idle') : 'idle';
    };
    const tierText = (name) => {
      const t = tiers.value[name];
      if (t === undefined) return tierBusy.value ? '检测中…' : '未检测';
      return TIER_SHORT[t.tier] || '未知';
    };
    const tierTitle = (name) => {
      const t = tiers.value[name];
      return t ? [t.label].concat(t.reasons || []).join('\n') : '还没有检测过';
    };

    // 只检测一个账户的等级。
    // 整表重测要把所有号轮一遍，而且是**串行**的（面板承诺同一时刻只有一个号
    // 在跟 OCI 通信），号一多就得等很久——只想确认某一个号的时候太亏。
    async function loadOneTier(name) {
      if (tierBusy.value) {
        ElMessage.warning('正在整表检测，等它跑完再单独查');
        return;
      }
      await withBusy('tier:' + name, async () => {
        try {
          // 列表只显示一个标签，不要限额明细，省一次请求
          const { data } = await axios.get(
            `/api/profiles/${encodeURIComponent(name)}/tier`, { params: { limits: false } });
          tiers.value = { ...tiers.value, [name]: data };
          // 接口判不出来时返回的是 200 + tier:unknown，不是报错。
          // 这种情况必须用警告色——弹一个绿色的「成功：无法确定」很荒唐。
          const label = data.label || TIER_SHORT[data.tier] || '未知';
          if (data.tier === 'unknown') {
            ElMessage.warning(`${name}：${label}（把鼠标放到「账户等级」那格看原因）`);
          } else {
            ElMessage.success(`${name}：${label}`);
          }
        } catch (e) {

            tiers.value = { ...tiers.value, [name]: {

    function readFileAsText(file, onDone) {
      const reader = new FileReader();
      reader.onload = () => onDone(String(reader.result || '').trim());
      reader.onerror = () => ElMessage.error('读取文件失败');
      reader.readAsText(file.raw || file);

    // xterm 体积不小，等真的要开终端时再加载
    let xtermReady = null;
    function ensureXterm() {
      if (xtermReady) return xtermReady;
      xtermReady = (async () => {
        if (!document.querySelector('link[data-xterm]')) {
          const css = document.createElement('link');
          css.rel = 'stylesheet'; css.dataset.xterm = '1';
          css.href = 'https://unpkg.com/xterm@5.3.0/css/xterm.css';
          document.head.appendChild(css);
        }
        const load = (src) => new Promise((res, rej) => {
          const el = document.createElement('script');
          el.src = src; el.onload = res; el.onerror = rej;
          document.head.appendChild(el);
        });
        if (typeof window.Terminal === 'undefined') {
          await load('https://unpkg.com/xterm@5.3.0/lib/xterm.js');
        }
        if (typeof window.FitAddon === 'undefined') {
          await load('https://unpkg.com/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js');
        }
      })();
      return xtermReady;
    }

    async function openTerm(target) {

      termConnected.value = false;

      catch { ElMessage.error('终端组件加载失败，检查网络连通性'); }
    }

    function closeTerm() {
      stopTermSpinner();
      termConnecting.value = false;
      if (termWs) { try { termWs.close(); } catch {} termWs = null; }
      if (termInst) { try { termInst.dispose(); } catch {} termInst = null; }
      if (termResizeHandler) {
        window.removeEventListener('resize', termResizeHandler);
        termResizeHandler = null;
      }
      termFit = null;
      termConnected.value = false;
      termKey.value = ''; termKeyName.value = ''; termPass.value = '';
    }

    function consoleTips() {
      const d = '\x1b[90m', y = '\x1b[33m', c = '\x1b[36m', r = '\x1b[0m';
      return '\r\n' +
        y + '串口控制台 (Serial Console) 已就绪' + r + '\r\n' +
        d + '通过 ' + r + c + 'login:' + r + d + ' 输入系统账户与密码验证登录。' + r + '\r\n\r\n';
    }

    async function termConnect() {
      if (!termKey.value) { ElMessage.warning('先选一个私钥文件'); return; }
      termConnecting.value = true;
      try {
        await ensureXterm();
        const { data } = await axios.post('/api/terminal/ticket');
        termInst = new window.Terminal({
          fontSize: 13, cursorBlink: true, convertEol: true,
          fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
          theme: { background: '#1e1d1b', foreground: '#eceae4', cursor: '#e08e70',
                   selectionBackground: '#463f3a' },
        });
        const FitAddon = window.FitAddon && (window.FitAddon.FitAddon || window.FitAddon);
        termFit = FitAddon ? new FitAddon() : null;
        if (termFit) termInst.loadAddon(termFit);
        termInst.open(termEl.value);
        if (termFit) termFit.fit();

        // 先在终端里写一行「正在连接」并转圈——不然从点「连接」到握手完成
        // 是十几秒的黑屏，看着就像网断了
        const frames = ['|', '/', '-', '\\'];
        let tick = 0;
        const what = termTarget.value === 'console' ? '串口控制台' : 'SSH';
        termInst.write('\x1b[90m正在连接 ' + what + ' … \x1b[0m ');
        stopTermSpinner();
        termSpinner = setInterval(() => {
          termInst.write('\b' + frames[tick++ % frames.length]);
        }, 120);

        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(
          `${proto}//${location.host}/api/terminal/ws?ticket=${encodeURIComponent(data.ticket)}`);
        termWs = ws;

        ws.onopen = () => {
          ws.send(JSON.stringify({
            type: 'open',
            target: termTarget.value,
            profile: detailRow.value.profile || currentProfile.value,
            instance_id: detailRow.value.id,
            compartment_id: detailRow.value.compartment_id,
            host: detail.value.public_ip || '',
            username: termUser.value || 'ubuntu',
            private_key: termKey.value,
            passphrase: termPass.value,
            cols: termInst.cols, rows: termInst.rows,
          }));
        };
        ws.onmessage = (ev) => {
          let m; try { m = JSON.parse(ev.data); } catch { return; }
          if (m.type === 'data') termInst.write(m.data);
          else if (m.type === 'ready') {
            stopTermSpinner();
            termConnecting.value = false;
            termInst.write('\r\x1b[K');        // 擦掉那行「正在连接…」
            termConnected.value = true;
            // 串口控制台连上之后是实例自己的 login: 提示符，密钥在这一层没用了。
            // 不说明的话，人会拿着刚上传的私钥对着提示符发愣。
            if (termTarget.value === 'console') termInst.write(consoleTips());
            // 连上之后私钥就没用了，从前端内存里也抹掉
            termKey.value = ''; termPass.value = '';
            termInst.focus();
          } else if (m.type === 'error') {
            stopTermSpinner();
            termConnecting.value = false;
            termInst.write(`\r\x1b[K\x1b[31m${m.message}\x1b[0m\r\n`);
            ElMessage.error(m.message);
          } else if (m.type === 'closed') {
            stopTermSpinner();
            termInst.write('\r\n\x1b[90m连接已断开\x1b[0m\r\n');
            termConnected.value = false;
          }
        };
        ws.onclose = (ev) => {
          stopTermSpinner();
          termConnecting.value = false;
          termConnected.value = false;
          if (ev.code === 4401) ElMessage.error('终端票据无效或已过期，请重试');
        };
        ws.onerror = () => ElMessage.error('终端连接出错');

        termInst.onData((d) => {
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'data', data: d }));
          }
        });
        termResizeHandler = () => {
          if (!termFit || !termInst) return;
          termFit.fit();
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'resize', cols: termInst.cols, rows: termInst.rows }));
          }
        };
        window.addEventListener('resize', termResizeHandler);
      } catch (e) {
        stopTermSpinner();
        termConnecting.value = false;
        ElMessage.error(errMsg(e, '打开终端失败'));
      }
      // 这里**不**收掉 termConnecting：WebSocket 开了不等于 SSH 已连上，
      // SSH 握手还要十几秒。真正的结果由 ready / error / close 三处各自收尾，
      // 否则按钮会在还在连的时候就停止转圈，看着像已经完事了。
    }

    async function loadTier(force) {

    // 多条策略时取最短的那条：真正卡住你的就是它
    const consoleDays = computed(() => {
      const list = (consolePolicy.value.policies || []).filter(p => p.expires_after_days > 0);
      if (!list.length) return 0;
      return Math.min(...list.map(p => p.expires_after_days));
    });

    async function loadConsolePolicy(force) {
      if (!currentProfile.value) return;
      if (consolePolicy.value.supported && !force) return;
      consoleLoading.value = true;
      try {
        const { data } = await axios.get(
          `/api/profiles/${encodeURIComponent(currentProfile.value)}/console-password-policy`);
        consolePolicy.value = data;
        consoleForm.days = consoleDays.value;
      } catch (e) {
        consolePolicy.value = { supported: false, policies: [], error: errMsg(e, '读取失败') };
      } finally { consoleLoading.value = false; }
    }

    async function saveConsolePolicy() {
      const days = Math.max(0, Number(consoleForm.days) || 0);
      try {
        await ElMessageBox.confirm(
          days === 0
            ? '把 Oracle 账号的控制台密码设为永不过期？\n这会改动 Identity Domain 的密码策略，等同于在 OCI 控制台里改。'
            : `把 Oracle 账号的控制台密码有效期设为 ${days} 天？`,
          '确认修改 Oracle 账号密码策略',
          { type: 'warning', confirmButtonText: '确认修改', cancelButtonText: '取消',
            customStyle: { whiteSpace: 'pre-wrap' } });
      } catch { return; }
      consoleSaving.value = true;
      try {
        const { data } = await axios.put(
          `/api/profiles/${encodeURIComponent(currentProfile.value)}/console-password-policy`,
          { days });
        consolePolicy.value = data.policy;
        consoleForm.days = consoleDays.value;
        ElMessage.success(days === 0 ? 'Oracle 账号密码已设为永不过期'
                                     : `Oracle 账号密码有效期已设为 ${days} 天`);
        if ((data.failed || []).length) {
          ElMessage.warning('部分策略没改成：' + data.failed.join('；'));
        }
      } catch (e) {
        ElMessage.error(errMsg(e, '修改失败'));
      } finally { consoleSaving.value = false; }
    }



    async function changePw() {
      if (pw.new_password.length < 8) { ElMessage.warning('新密码至少 8 位'); return; }
      loading.value = true;
      try {
        await axios.post('/api/auth/change-password', { ...pw });
        ElMessage.success('密码已更新，请用新密码重新登录');
        pw.old_password = ''; pw.new_password = '';
        clearSession();
      } catch (e) { ElMessage.error(errMsg(e, '修改失败')); }
      finally { loading.value = false; }
    }

    // ---- 展示 ----


    const STATE_TONE = {
      RUNNING: 'ok', STOPPED: 'idle',
      STARTING: 'warn', STOPPING: 'warn', PROVISIONING: 'warn', CREATING_IMAGE: 'warn', MOVING: 'warn',
    };
    const STATE_TEXT = {
      RUNNING: '运行中', STOPPED: '已停止', STARTING: '启动中', STOPPING: '停止中',
      PROVISIONING: '创建中', TERMINATED: '已终止', TERMINATING: '终止中', MOVING: '迁移中',
      CREATING_IMAGE: '制作镜像',
    };
    const stateTone = (s) => STATE_TONE[s] || 'crit';
    const stateText = (s) => STATE_TEXT[s] || s || '未知';

    function specText(row) {
      const parts = [row.shape || '—'];
      if (row.ocpus) parts.push(`${row.ocpus} OCPU`);
      if (row.memory_gb) parts.push(`${row.memory_gb} GB`);
      return parts.join(' · ');
    }
    const fmtPct = (v) => (v === null || v === undefined ? '—' : v.toFixed(1) + '%');
    function fmtDate(s) {
      if (!s) return '—';
      const d = new Date(s);
      return isNaN(d) ? '—' : d.toLocaleDateString('zh-CN');
    }
    function fmtTime(s) {
      if (!s) return '—';
      const d = new Date(s);
      return isNaN(d) ? '—' : d.toLocaleString('zh-CN', { hour12: false });
    }
    function fmtUtc(s) {
      if (!s) return '—';
      // SQLite datetime('now') 是 UTC，补上时区标记再转本地
      const d = new Date(s.replace(' ', 'T') + 'Z');
      return isNaN(d) ? s : d.toLocaleString('zh-CN', { hour12: false });
    }
    async function copy(text) {
      try {
        await navigator.clipboard.writeText(text);
        ElMessage.success(`已复制 ${text}`);
      } catch {
        ElMessage.warning('浏览器拒绝了复制，请手动选中');
      }
    }

    // ---- 折线图（点数不过千，内联 SVG 足够，也免掉一个图表库依赖）----
    const SERIES_STYLE = {
      CpuUtilization: { color: '#b04f2d', dash: false },
      MemoryUtilization: { color: '#7f601b', dash: true },
    };
    const withPoints = computed(() => metrics.value.filter(m => m.points && m.points.length > 1));
    const hasMetricPoints = computed(() => withPoints.value.length > 0);
    const axisPoints = computed(() => {
      let best = [];
      withPoints.value.forEach(m => { if (m.points.length > best.length) best = m.points; });
      return best;
    });
    const yMax = computed(() => {
      let max = 0;
      withPoints.value.forEach(m => m.points.forEach(p => { if (p.v > max) max = p.v; }));
      return Math.max(100, Math.ceil(max / 20) * 20);
    });
    const xAt = (i, n) => PAD_L + (n <= 1 ? 0 : (i / (n - 1)) * (CW - PAD_L - PAD_R));
    const yAt = (v) => PAD_T + (1 - v / yMax.value) * (CH - PAD_T - PAD_B);

    const chartSeries = computed(() => withPoints.value.map(m => {
      const style = SERIES_STYLE[m.metric] || { color: '#706c61', dash: false };
      const n = m.points.length;
      const coords = m.points.map((p, i) => [xAt(i, n), yAt(p.v)]);
      const line = coords.map((c, i) => (i ? 'L' : 'M') + c[0].toFixed(1) + ' ' + c[1].toFixed(1)).join(' ');
      const base = (CH - PAD_B).toFixed(1);
      const area = `${line} L${coords[n - 1][0].toFixed(1)} ${base} L${coords[0][0].toFixed(1)} ${base} Z`;
      return { metric: m.metric, name: m.name, color: style.color, dash: style.dash, line, area, points: m.points };
    }));

    // 只给实线系列铺面积，虚线系列叠面积会糊成一片
    const areaSeries = computed(() => chartSeries.value.filter(s => !s.dash));

    const gridLines = computed(() => {
      const step = yMax.value / 4;
      return [0, 1, 2, 3, 4].map(k => ({
        y: +yAt(k * step).toFixed(1),
        label: Math.round(k * step) + '%',
      }));
    });
    const axisStart = computed(() => {
      const p = axisPoints.value[0];
      return p ? shortTime(p.t) : '';
    });
    const axisEnd = computed(() => {
      const p = axisPoints.value[axisPoints.value.length - 1];
      return p ? shortTime(p.t) : '';
    });
    function shortTime(t) {
      const d = new Date(t);
      if (isNaN(d)) return '';
      return metricHours.value > 24
        ? d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' })
        : d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
    }
    function onChartMove(e) {
      const n = axisPoints.value.length;
      if (n < 2) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      const x = ratio * CW;
      const i = Math.round(((x - PAD_L) / (CW - PAD_L - PAD_R)) * (n - 1));
      hoverIdx.value = Math.max(0, Math.min(n - 1, i));
    }
    const hoverX = computed(() => xAt(hoverIdx.value, axisPoints.value.length).toFixed(1));
    const hoverTime = computed(() => {
      const p = axisPoints.value[hoverIdx.value];
      return p ? fmtTime(p.t) : '';
    });
    function hoverValue(s) {
      const p = s.points[hoverIdx.value];
      return p ? p.v.toFixed(1) + '%' : '—';
    }

    // ---- 自动刷新 ----
    const autoRefresh = ref(localStorage.getItem('ocix_auto') === '1');
    const countdown = ref(30);
    let timer = null;
    watch(autoRefresh, (on) => {
      localStorage.setItem('ocix_auto', on ? '1' : '0');
      if (on) startAutoTimer(); else stopAutoTimer();
    }, { immediate: true });
    // 不开自动刷新就压根不要有定时器在跑：
    // 之前是每秒都醒一次，只是判断后什么都不做——白白占着，也容易让人误以为
    // 面板在后台偷偷请求 OCI。现在打开开关才创建，关掉立刻销毁。
    function stopAutoTimer() {
      if (timer) { clearInterval(timer); timer = null; }
    }
    function startAutoTimer() {
      stopAutoTimer();
      countdown.value = 30;
      timer = setInterval(() => {
        if (!token.value || document.hidden) return;   // 页面在后台就不计时
        countdown.value -= 1;
        if (countdown.value <= 0) { countdown.value = 30; if (!loading.value) refreshActive(); }
      }, 1000);
    }
    onUnmounted(stopAutoTimer);

    onMounted(async () => {
      if (!token.value) return;
      try {
        const { data } = await axios.get('/api/auth/me');
        user.value = data.user;
        appVersion.value = data.version || '';
        await loadLock();
        await bootData();
      } catch { /* 401 已由拦截器处理 */ }
    });

    const HOUR_RANGES = [
      { v: 1, t: '1 小时' }, { v: 6, t: '6 小时' }, { v: 24, t: '24 小时' }, { v: 168, t: '7 天' },
    ];

    return {
      loginCanvas, loginFlow,
      // ── SSH 公钥池与 TG ──
      sshKeys, sshKeysLoading, keyForm, keyModalOpen, keySaving, keyModalTitle, selectedKeyId, selectedConsoleKeyId,
      loadSshKeys, openCreateKeyModal, openEditKeyModal, saveSshKey, deleteSshKey, onSelectKeyFromVault, onSelectConsoleKeyFromVault,
      tgSettings, tgLoading, tgSaving, tgTesting, loadTgSettings, saveTgSettings, testTgConnection,
      currentTabLabel,
      fleet, storageUsedGb,
      pwShown, rollRootPassword,
      createStep, pollJob,
      CW, CH, HOUR_RANGES, areaSeries, NAV, go, orphanBadge,
      pubKeyName, ipv6Busy,
      rollName, onPubKeyFile, addIpv6,
      firewall, fwInstance, fwLoading, fwBusy, loadFirewall, allowAll, revokeAll,
      ruleForm, addRule, deleteRule, clearRules, vpuRange, vpuTier,
      upd, updBusy, updRunning, updStateText, updTagType, doUpdate,
      consolePolicy, consoleForm, consoleLoading, consoleSaving, consoleDays,
      loadConsolePolicy, saveConsolePolicy,
      tier, tierLoading, loadTier, tiers, tierBusy, loadAllTiers,
      loadOneTier,
      lockedProfile, toggleLock, isBusy, refreshConsole,
      detailOpen, detailLoading, detail, openDetail, refreshDetail,
      resizeForm, resizing, doResize, syncResizeMem,
      growForm, growing, doGrow,
      consoleKey, consoling, doConsole, dropConsole,
      backups, backupsLoading, backingUp, loadBackups, doBackup, dropBackup, doRestore,
      consoleKeyMode, onConsoleKeyFile,
      termAvailable, termOpen, termTarget, termUser, termKey, termKeyName, termPass,
      termConnecting, termConnected, termEl, termTitle,
      openTerm, closeTerm, termConnect, onPrivateKeyFile,
      egress, egressLoading, loadEgress, fmtGb, fmtDay,
      cost, invoices, billingLoading, loadBilling, invoiceDot, invoiceText,
      tierDot, tierText, tierTitle, tierDotOf,
      sys, sysLoading, loadSystem,
      changeIp, changePerformance,
      token, user, loginForm, loginErr, loading, netBusy,
      profiles, profilesLoading, currentProfile, compartments, compsLoading, compartmentId,
      subtree, activeTab, lastUpdated, autoRefresh, countdown,
      appVersion, serviceOk, serviceHint,
      instances, instSelection, instTableRef, usage,
      metrics, metricInstance, metricHours, metricsLoading,
      chartSeries, gridLines, hasMetricPoints, axisStart, axisEnd, hoverIdx, hoverX, hoverTime,
      importForm, importing, pw,
      auditLogs, auditTotal, auditActions, auditPage, auditSize, auditLoading, auditFilter,
      opts, optsLoading, createForm, isArm, canCreate, creating,
      preflight, preflightLoading, storage, storageLoading,
      doLogin, logout, refreshActive, loadMetrics, loadAudit,
      onProfileChange, onTabChange, act, batchAct, clearInstSelection,
      canStart, canStop, canReset, stateTone, stateText, specText,
      fmtPct, fmtDate, fmtTime, fmtUtc, copy, onChartMove, hoverValue,
      onKeyFile, importProfile, testProfile, delProfile, purgeAudit, changePw,
      pickShape, onOcpuChange, runPreflight, createInstance,
      terminate, loadStorage, deleteVolume, volRowClass,
    };
  },
}).use(ElementPlus).mount('#app');
});
</script>
</body>
