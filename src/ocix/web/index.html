<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCIX · Oracle Always Free 开机面板</title>
  <link rel="stylesheet" href="/assets/element-plus.css" />
  <link rel="stylesheet" href="/assets/element-plus-dark.css" />
  <style>
    :root {
      --bg:#0b1220; --panel:#131c2e; --panel-2:#162134; --line:#253349;
      --text:#e2e8f0; --muted:#8fa3bf; --accent:#38bdf8;
      --ok:#22c55e; --warn:#f59e0b; --crit:#ef4444; --idle:#64748b;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
    }
    /* Element Plus 暗色变量接到本站色板，避免组件和外壳像两套系统 */
    html.dark {
      --el-bg-color: var(--panel);
      --el-bg-color-page: var(--bg);
      --el-bg-color-overlay: var(--panel-2);
      --el-text-color-primary: var(--text);
      --el-text-color-regular: #cbd5e1;
      --el-text-color-secondary: var(--muted);
      --el-text-color-placeholder: #64748b;
      --el-border-color: var(--line);
      --el-border-color-light: var(--line);
      --el-border-color-lighter: var(--line);
      --el-border-color-extra-light: var(--line);
      --el-fill-color-blank: var(--panel);
      --el-fill-color-light: #1a2439;
      --el-fill-color-lighter: #172032;
      --el-color-primary: #38bdf8;
      --el-color-success: var(--ok);
      --el-color-warning: var(--warn);
      --el-color-danger: var(--crit);
      --el-color-error: var(--crit);
      --el-color-info: var(--idle);
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:var(--sans); background:var(--bg); color:var(--text);
           font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
    #app { min-height:100vh; }
    /* 机器产出的值一律等宽 + 等宽数字，便于纵向比对和复制 */
    .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px; letter-spacing:-.01em; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

    /* 顶部全局进度条：任何请求在飞就显示，让「点了没反应」变成「在跑」 */
    .netbar { position:fixed; top:0; left:0; height:2px; width:100%; z-index:2000;
              background:transparent; pointer-events:none; }
    .netbar > i { display:block; height:100%; width:100%; transform-origin:0 50%;
                  background:linear-gradient(90deg, var(--accent), #a78bfa);
                  animation:netbar 1.1s ease-in-out infinite; }
    @keyframes netbar {
      0%   { transform:scaleX(0);   opacity:1; }
      50%  { transform:scaleX(.65); opacity:1; }
      100% { transform:scaleX(1);   opacity:0; }
    }

    /* 刷新按钮的旋转图标 */
    .spin { animation:spin 900ms linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .btn-icon { width:14px; height:14px; vertical-align:-2px; margin-right:5px; }

    /* 骨架屏：首次加载时占位，避免大片空白 */
    .skel { border-radius:6px; background:linear-gradient(90deg,
            #1a2439 25%, #243149 37%, #1a2439 63%);
            background-size:400% 100%; animation:shimmer 1.3s ease-in-out infinite; }
    @keyframes shimmer { 0% { background-position:100% 50%; } 100% { background-position:0 50%; } }
    .skel-row { height:34px; margin-bottom:8px; }
    .skel-row:nth-child(2) { opacity:.8; }
    .skel-row:nth-child(3) { opacity:.6; }
    .skel-row:nth-child(4) { opacity:.4; }

    /* 数据刷新时轻微压暗，明确「这是旧数据，正在更新」 */
    .stale { opacity:.55; transition:opacity .2s ease; pointer-events:none; }

    .topbar { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-4);
              padding:var(--sp-3) var(--sp-5); background:#0d1526; border-bottom:1px solid var(--line);
              position:sticky; top:0; z-index:20; flex-wrap:wrap; }
    .brand { font-weight:700; font-size:17px; letter-spacing:.4px; white-space:nowrap; }
    .brand span { color:var(--accent); }
    .brand small { display:block; font-weight:400; font-size:11px; color:var(--muted); letter-spacing:0; }
    .topbar-right { display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap; }
    .who { color:var(--muted); font-size:12.5px; }

    /* 左侧竖向导航 + 右侧内容 */
    .shell { display:flex; align-items:flex-start; min-height:calc(100vh - 57px); }
    .rail { width:212px; flex:none; padding:var(--sp-4) var(--sp-3); align-self:stretch;
            border-right:1px solid var(--line); background:#0d1526;
            position:sticky; top:57px; max-height:calc(100vh - 57px); overflow-y:auto; }
    .rail-group + .rail-group { margin-top:var(--sp-4); }
    .rail-title { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
                  color:#64748b; padding:0 10px var(--sp-2); font-weight:600; }
    .rail-item { display:flex; align-items:center; gap:10px; width:100%; text-align:left;
                 background:none; border:0; color:var(--muted); font-family:var(--sans);
                 font-size:13.5px; padding:8px 10px; border-radius:7px; cursor:pointer;
                 transition:background .18s ease, color .18s ease; position:relative; }
    .rail-item svg { width:17px; height:17px; flex:none; opacity:.85; }
    .rail-item:hover { background:#18233a; color:var(--text); }
    .rail-item.on { background:rgba(56,189,248,.13); color:var(--accent); }
    .rail-item.on::before { content:""; position:absolute; left:-13px; top:7px; bottom:7px;
                            width:2px; border-radius:0 2px 2px 0; background:var(--accent); }
    .rail-item em { margin-left:auto; font-style:normal; font-size:11px; font-weight:600;
                    background:var(--crit); color:#fff; border-radius:9px; padding:1px 6px; }
    .main { flex:1; min-width:0; padding:var(--sp-5); max-width:1400px; }
    .pane { display:block; }

    .container { max-width:1400px; margin:0 auto; padding:var(--sp-5); }
    .toolbar { display:flex; gap:var(--sp-3); flex-wrap:wrap; align-items:center; margin-bottom:var(--sp-4); }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
            padding:var(--sp-4); margin-bottom:var(--sp-4); }
    .card-head { display:flex; align-items:baseline; justify-content:space-between;
                 gap:var(--sp-3); margin-bottom:var(--sp-3); flex-wrap:wrap; }
    .card-title { font-size:13px; font-weight:600; letter-spacing:.02em; }
    .hint { font-size:12px; color:var(--muted); line-height:1.7; margin:var(--sp-3) 0 0; }
    .table-wrap { overflow-x:auto; }

    /* 登录 */
    .login-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:var(--sp-4); }
    .login-card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line);
                  padding:var(--sp-6); border-radius:12px; }
    .login-card h1 { margin:0 0 var(--sp-1); font-size:20px; letter-spacing:.4px; }
    .login-card h1 span { color:var(--accent); }
    .login-sub { color:var(--muted); font-size:12.5px; margin:0 0 var(--sp-5); }

    /* 状态点：本面板唯一允许动的东西——只有过渡态才脉动 */
    .state { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
    .dot { width:8px; height:8px; border-radius:50%; flex:none; position:relative; background:var(--idle); }
    .dot::after { content:""; position:absolute; inset:-4px; border-radius:50%;
                  border:1px solid currentColor; opacity:.35; }
    .dot.ok { background:var(--ok); color:var(--ok); }
    .dot.warn { background:var(--warn); color:var(--warn); animation:pulse 1.6s ease-out infinite; }
    .dot.crit { background:var(--crit); color:var(--crit); }
    .dot.idle { background:var(--idle); color:var(--idle); }
    .state-label { font-size:12px; font-variant-numeric:tabular-nums; }
    @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(245,158,11,.55); } 70% { box-shadow:0 0 0 7px rgba(245,158,11,0); } 100% { box-shadow:0 0 0 0 rgba(245,158,11,0); } }

    /* 自动刷新指示灯 */
    .live { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
    .live .dot { width:6px; height:6px; }
    .live .dot::after { display:none; }

    /* 统计条 */
    .stats { display:flex; gap:var(--sp-5); flex-wrap:wrap; }
    .stat { min-width:92px; }
    .stat .v { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:24px; font-weight:600; line-height:1.2; }
    .stat .k { font-size:11.5px; color:var(--muted); letter-spacing:.03em; }
    .stat.ok .v { color:var(--ok); } .stat.idle .v { color:var(--idle); } .stat.crit .v { color:var(--crit); }

    /* 批量操作条 */
    .bulkbar { display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap;
               background:var(--panel-2); border:1px solid var(--accent); border-radius:8px;
               padding:var(--sp-2) var(--sp-3); margin-bottom:var(--sp-3); }
    .bulkbar .count { font-family:var(--mono); font-size:12.5px; color:var(--accent); }

    /* 额度进度 */
    .quota { display:grid; grid-template-columns:150px 1fr 132px; gap:var(--sp-3);
             align-items:center; padding:var(--sp-2) 0; border-bottom:1px solid var(--line); }
    .quota:last-child { border-bottom:0; }
    .quota .label { font-size:12.5px; color:#cbd5e1; }
    .quota .num { font-family:var(--mono); font-size:12.5px; text-align:right; color:var(--muted); }
    .quota .num b { color:var(--text); font-weight:600; }
    .bar { height:6px; border-radius:3px; background:#1d2740; overflow:hidden; }
    .bar > i { display:block; height:100%; border-radius:3px; background:var(--accent);
               transition:width .3s ease; }
    .bar.warn > i { background:var(--warn); } .bar.over > i { background:var(--crit); }

    /* 监控图 */
    .chart { position:relative; width:100%; }
    .chart svg { display:block; width:100%; height:auto; }
    .chart .grid { stroke:var(--line); stroke-width:1; }
    .chart .axis-t { fill:var(--muted); font-size:10px; font-family:var(--mono); }
    .legend { display:flex; gap:var(--sp-4); flex-wrap:wrap; font-size:12px; color:var(--muted); margin-bottom:var(--sp-2); }
    .legend i { display:inline-block; width:18px; height:0; border-top-width:2px; margin-right:6px;
                vertical-align:middle; }
    .readout { position:absolute; top:0; right:0; background:var(--panel-2); border:1px solid var(--line);
               border-radius:6px; padding:6px 9px; font-family:var(--mono); font-size:11.5px; pointer-events:none; }
    .readout div + div { margin-top:2px; }

    /* 新建实例：左表单 / 右额度预检 */
    .create-grid { display:grid; grid-template-columns:1fr 380px; gap:var(--sp-5); align-items:start; }
    .pf-card { background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
               padding:var(--sp-4); position:sticky; top:76px; }
    .pf-card.ok { border-color:rgba(34,197,94,.45); }
    .pf-card.bad { border-color:rgba(239,68,68,.55); }
    .pf-head { display:flex; align-items:center; justify-content:space-between;
               gap:var(--sp-2); margin-bottom:var(--sp-3); }
    .pf-row { display:grid; grid-template-columns:auto 1fr auto; gap:var(--sp-2);
              align-items:center; padding:7px 0; border-bottom:1px solid var(--line); }
    .pf-row:last-of-type { border-bottom:0; }
    .pf-label { font-size:12.5px; color:#cbd5e1; }
    .pf-calc { font-size:12px; color:var(--muted); white-space:nowrap; }
    .pf-calc em { font-style:normal; color:var(--accent); }
    .pf-calc b { color:var(--text); font-weight:600; }
    .pf-msg { font-size:12px; line-height:1.6; margin-top:var(--sp-2); padding:8px 10px;
              border-radius:6px; }
    .pf-msg.crit { color:#fecaca; background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.35); }
    .pf-msg.warn { color:#fde68a; background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.35); }
    .el-table .orphan-row td { background:rgba(239,68,68,.07) !important; }
    code { font-family:var(--mono); font-size:12px; background:#1a2439; padding:1px 5px; border-radius:4px; }
    @media (max-width:1100px) {
      .create-grid { grid-template-columns:1fr; }
      .pf-card { position:static; }
    }

    /* 分段选择器：不依赖 Element Plus 的版本差异 */
    .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
    .seg button { appearance:none; border:0; background:transparent; color:var(--muted);
                  font-family:var(--sans); font-size:12.5px; padding:6px 13px; cursor:pointer;
                  border-right:1px solid var(--line); transition:background .18s ease, color .18s ease; }
    .seg button:last-child { border-right:0; }
    .seg button:hover { background:#1a2439; color:var(--text); }
    .seg button.on { background:var(--accent); color:#06121f; font-weight:600; }

    /* 卷性能与防火墙规则表单 */
    .vpu-cell { display:flex; align-items:center; gap:8px; }
    .vpu-tier { font-size:11.5px; color:var(--muted); white-space:nowrap; }
    .vpu-tier.paid { color:var(--warn); }
    .rule-form { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
                 background:var(--panel-2); border:1px solid var(--line);
                 border-radius:8px; padding:var(--sp-3); }
    .rule-sep { color:var(--muted); font-size:12.5px; }

    /* 防火墙状态条 */
    .fw-verdict { display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap;
                  background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
                  padding:var(--sp-3) var(--sp-4); margin-bottom:var(--sp-3); }
    .fw-verdict.open { border-color:rgba(245,158,11,.5); }
    .fw-verdict.partial { border-color:rgba(34,197,94,.4); }
    .fw-verdict b { display:block; font-size:13.5px; }
    .fw-verdict span { font-size:12px; color:var(--muted); }
    .fw-actions { margin-left:auto; }

    /* 版本对比与命令块 */
    .ver-row { display:flex; align-items:center; gap:var(--sp-4); margin-bottom:var(--sp-4); }
    .ver-box { background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
               padding:var(--sp-3) var(--sp-4); min-width:130px; }
    .ver-box .k { font-size:11.5px; color:var(--muted); }
    .ver-box .v { font-size:19px; font-weight:600; margin-top:2px; }
    .ver-arrow { color:var(--muted); font-size:18px; }
    .cmd-box { display:flex; align-items:center; gap:var(--sp-2); background:#0b1220;
               border:1px solid var(--line); border-radius:7px; padding:10px 12px;
               margin:var(--sp-2) 0 var(--sp-3); overflow-x:auto; }
    .cmd-box code { background:none; padding:0; color:#cbd5e1; white-space:nowrap; font-size:12.5px; }
    .cmd-box .copy-btn { margin-left:auto; flex:none; }
    .link { color:var(--accent); text-decoration:none; }
    .link:hover { text-decoration:underline; }

    .empty { text-align:center; color:var(--muted); padding:var(--sp-6) var(--sp-4); font-size:13px; }
    .empty b { display:block; color:var(--text); font-size:14px; margin-bottom:6px; font-weight:600; }
    .ip-cell { display:inline-flex; align-items:center; gap:6px; max-width:100%; }
    /* 公网 IP 为主、内网 IP 作次要行，比单开一列省 130px，表格就不会宽到被固定列盖住 */
    .ip-stack { display:flex; flex-direction:column; gap:1px; line-height:1.35; }
    .ip-sub { font-size:11px; color:var(--muted); }
    .ip-trunc { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    /* 操作列强制一排：默认的 margin-left 会把 4 个按钮挤到第二行 */
    .row-actions { display:flex; flex-wrap:nowrap; align-items:center; gap:5px; }
    .row-actions .el-button { margin-left:0 !important; padding-left:9px; padding-right:9px; }
    .row-actions .el-button.term-btn { padding-left:5px; padding-right:5px; }

    /* 地址旁边的迷你操作按钮 */
    .mini-btn { background:#1d2740; border:1px solid var(--line); color:var(--muted);
                font-family:var(--sans); font-size:11px; line-height:1; padding:3px 6px;
                border-radius:4px; cursor:pointer; transition:color .18s ease, border-color .18s ease; }
    .mini-btn:hover { color:var(--accent); border-color:var(--accent); }
    .el-button.term-btn { color:var(--crit); padding-left:6px; padding-right:6px; }
    .el-button.term-btn:hover { color:var(--crit); background:rgba(239,68,68,.12); }
    .copy-btn { background:none; border:0; color:var(--muted); cursor:pointer; padding:2px;
                border-radius:4px; line-height:0; transition:color .18s ease, background .18s ease; }
    .copy-btn:hover { color:var(--accent); background:#1d2740; }
    .el-button, .copy-btn, .el-select, [role="tab"] { cursor:pointer; }
    .el-table .cell { line-height:1.45; }

    /* 窄屏：左侧导航压成顶部横向可滚动条 */
    @media (max-width:900px) {
      .shell { display:block; }
      .rail { width:auto; position:static; max-height:none; border-right:0;
              border-bottom:1px solid var(--line); padding:var(--sp-2) var(--sp-3);
              overflow-x:auto; overflow-y:hidden; }
      .rail nav { display:flex; gap:var(--sp-3); }
      .rail-group { display:flex; align-items:center; gap:4px; }
      .rail-group + .rail-group { margin-top:0; padding-left:var(--sp-3);
                                  border-left:1px solid var(--line); }
      .rail-title { display:none; }
      .rail-item { width:auto; white-space:nowrap; padding:9px 12px; }
      .rail-item.on::before { display:none; }
      .main { padding:var(--sp-3); }
    }
    @media (max-width:860px) {
      .container { padding:var(--sp-3); }
      .quota { grid-template-columns:1fr; gap:var(--sp-1); }
      .quota .num { text-align:left; }
      /* 手机上「把机器开回来」是主路径，表格里的按钮不能是 25px 的小条 */
      .el-table .el-button--small { min-height:36px; padding-left:12px; padding-right:12px; }
      .el-table .el-button + .el-button { margin-left:8px; }
      .bulkbar .el-button { min-height:36px; }
      .seg button { padding:10px 14px; }
    }
    /* 复制按钮视觉上很小，但点击区域补到 44×44 */
    .copy-btn { position:relative; }
    .copy-btn::after { content:""; position:absolute; left:50%; top:50%;
                       width:44px; height:44px; transform:translate(-50%,-50%); }
    @media (prefers-reduced-motion: reduce) {
      .netbar > i, .skel, .spin { animation:none !important; }
      .netbar > i { transform:scaleX(1); opacity:.9; }
      *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important;
                               transition-duration:.001ms !important; }
      .dot.warn { box-shadow:0 0 0 3px rgba(245,158,11,.3); }
    }
  </style>
</head>
<body>
<div id="app"></div>

<script type="text/html" id="app-tpl">
  <!-- ── 登录 ── -->
  <div class="login-wrap" v-if="!token">
    <div class="login-card">
      <h1>OCI<span>X</span></h1>
      <p class="login-sub">管理你自己的 Oracle 租户。登录后可查看并开关所有账户下的实例。</p>
      <el-alert v-if="loginErr" :title="loginErr" type="error" show-icon :closable="false" style="margin-bottom:14px;" />
      <el-form @submit.prevent="doLogin" label-position="top">
        <el-form-item label="用户名">
          <el-input v-model="loginForm.username" size="large" autocomplete="username" @keyup.enter="doLogin" />
        </el-form-item>
        <el-form-item label="密码">
          <el-input v-model="loginForm.password" type="password" size="large" show-password
                    autocomplete="current-password" @keyup.enter="doLogin" />
        </el-form-item>
        <el-button type="primary" size="large" style="width:100%;" @click="doLogin" :loading="loading">登录</el-button>
      </el-form>
      <p class="hint">首次登录后请立刻改密。面板只操作你自己的 OCI 租户，不做注册或抢机。</p>
    </div>
  </div>

  <!-- ── 主面板 ── -->
  <div v-else>
    <div class="netbar" v-show="netBusy" aria-hidden="true"><i></i></div>
    <div class="topbar">
      <div class="brand">OCI<span>X</span><small>Always Free 开机面板</small></div>
      <div class="topbar-right">
        <span class="live" v-if="autoRefresh">
          <i class="dot ok"></i>{{ countdown }}s 后自动刷新
        </span>
        <el-switch v-model="autoRefresh" size="small" active-text="自动刷新" />
        <span class="who">{{ user }}</span>

            <div class="table-wrap" v-else-if="allFlat.length" :class="{ stale: loading }">

                </el-table-column>
                <el-table-column prop="display_name" label="名称" min-width="150" show-overflow-tooltip />
                <el-table-column label="规格" min-width="180">

                    <span class="ip-cell" v-if="row.public_ip">

                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                      </button>
                    </span>
                    <span v-else class="mono" style="color:var(--muted);">—</span>
                  </template>
                </el-table-column>
                <el-table-column prop="region" label="区域" width="120">
                  <template #default="{row}"><span class="mono">{{ row.region || '—' }}</span></template>
                </el-table-column>
                <el-table-column label="操作" width="196" fixed="right">
                  <template #default="{row}">
                    <el-button size="small" type="success" :disabled="!canStart(row)" @click="act(row,'START')">开机</el-button>
                    <el-button size="small" :disabled="!canStop(row)" @click="act(row,'SOFTSTOP')">关机</el-button>
                    <el-button size="small" type="warning" :disabled="!canReset(row)" @click="act(row,'SOFTRESET')">重启</el-button>
                  </template>
                </el-table-column>
              </el-table>
            </div>
            <div class="empty" v-else-if="!loading">
              <b>没有查到实例</b>
              所有账户下都没有存活的实例。若确认实例存在，试试勾选「含子 compartment」。
            </div>
          </div>
        </section>

        <!-- 单账户实例 -->
        <section class="pane" v-show="activeTab === 'instances'">
          <div class="card">
            <div class="card-head">
              <div class="card-title">{{ currentProfile || '未选择账户' }} 的实例</div>
              <span class="who">{{ instances.length }} 台</span>
            </div>

            <div class="bulkbar" v-if="instSelection.length">

              <el-button size="small" @click="batchAct(instSelection,'SOFTSTOP')">关机</el-button>
              <el-button size="small" type="warning" @click="batchAct(instSelection,'SOFTRESET')">重启</el-button>
              <el-button size="small" text @click="clearInstSelection">取消选择</el-button>
            </div>

            <div v-if="loading && !instances.length" aria-label="加载中">
              <div class="skel skel-row" v-for="i in 4" :key="i"></div>
            </div>
            <div class="table-wrap" v-else-if="instances.length" :class="{ stale: loading }">
              <el-table ref="instTableRef" :data="instances" size="small" stripe border row-key="id"
                        @selection-change="instSelection = $event" style="width:100%;">
                <el-table-column type="selection" width="42" />
                <el-table-column label="状态" width="118">
                  <template #default="{row}">
                    <span class="state">
                      <i :class="['dot', stateTone(row.state)]"></i>
                      <span class="state-label">{{ stateText(row.state) }}</span>
                    </span>
                  </template>
                </el-table-column>
                <el-table-column prop="display_name" label="名称" min-width="118" show-overflow-tooltip />
                <el-table-column label="规格" min-width="140">
                  <template #default="{row}"><span class="mono">{{ specText(row) }}</span></template>
                </el-table-column>
                <!-- 改地址的操作就放在地址旁边，操作列只留开关机，表格才不会宽到被固定列盖住 -->
                <el-table-column label="公网 IP" min-width="180">
                  <template #default="{row}">
                    <div class="ip-stack">
                      <span class="ip-cell">
                        <template v-if="row.public_ip">
                          <span class="mono">{{ row.public_ip }}</span>
                          <button class="copy-btn" @click="copy(row.public_ip)" :aria-label="'复制 ' + row.public_ip">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                          </button>
                          <el-tooltip content="更换公网 IPv4 地址" placement="top">
                            <button class="mini-btn" @click="changeIp(row)" aria-label="更换公网 IP">更换</button>
                          </el-tooltip>
                        </template>
                        <span v-else class="mono" style="color:var(--muted);">无公网 IP</span>
                      </span>
                      <span class="ip-sub mono" v-if="row.private_ip">内网 {{ row.private_ip }}</span>
                    </div>
                  </template>
                </el-table-column>
                <el-table-column label="IPv6" min-width="150">
                  <template #default="{row}">

                      <button class="copy-btn" @click="copy(row.ipv6)" :aria-label="'复制 ' + row.ipv6">

                      </button>
                    </span>
                    <el-button v-else size="small" text type="primary" :loading="ipv6Busy === row.id"
                               @click="addIpv6(row)">+ 添加</el-button>

                </el-table-column>
                <el-table-column label="创建于" width="100">
                  <template #default="{row}"><span class="mono">{{ fmtDate(row.time_created) }}</span></template>
                </el-table-column>

                      <el-button size="small" type="warning" :disabled="!canReset(row)" @click="act(row,'SOFTRESET')">重启</el-button>
                      <el-button size="small" text class="term-btn" @click="terminate(row)">终止</el-button>
                    </div>
                  </template>
                </el-table-column>
              </el-table>
            </div>
            <div class="empty" v-else-if="!loading">

            <p class="hint">被 Oracle 回收或停掉的免费实例不会自动重开，需要你手动点击「开机」——这是为了守住 Oracle 的回收策略，不做抢机。</p>
          </div>

        <!-- 新建实例 -->
        <section class="pane" v-show="activeTab === 'create'">
          <div class="card">

              <span class="who">仅提供 Always Free 规格</span>
            </div>

            <el-alert v-if="opts.needs_network" type="info" show-icon :closable="false"
                      style="margin-bottom:14px;" title="这个账户还没有网络，创建第一台机器时会自动建好"
                      description="面板会建一个 VCN + 互联网网关 + 公共子网，之后所有实例都用它，无需手动干预。" />

            <div class="create-grid">
              <div>
                <el-form label-position="top">
                  <el-form-item label="实例名称">
                    <div style="display:flex; gap:8px; width:100%;">
                      <el-input v-model="createForm.display_name" style="flex:1;" placeholder="例如 payments-api-01" />
                      <el-button @click="rollName" title="重新生成名称">重新生成</el-button>
                    </div>
                  </el-form-item>

                  <el-form-item label="规格">
                    <div class="seg" role="group" aria-label="规格">
                      <button v-for="s in opts.shapes" :key="s.shape" type="button"
                              :class="{ on: createForm.shape === s.shape }"
                              :aria-pressed="createForm.shape === s.shape"
                              @click="pickShape(s)">{{ s.label }}</button>
                    </div>
                  </el-form-item>

                  <template v-if="isArm">
                    <el-form-item :label="'OCPU：' + createForm.ocpus + ' 核'">
                      <el-slider v-model="createForm.ocpus" :min="1" :max="4" :step="1"
                                 show-stops @change="onOcpuChange" style="width:100%;" />
                    </el-form-item>
                    <el-form-item :label="'内存：' + createForm.memory_gb + ' GB（每 OCPU 最多 ' + opts.arm_gb_per_ocpu + 'GB）'">
                      <el-slider v-model="createForm.memory_gb" :min="1" :max="24" :step="1"
                                 @change="runPreflight" style="width:100%;" />
                    </el-form-item>
                  </template>
                  <el-form-item v-else label="规格配置">
                    <span class="mono" style="color:var(--muted);">1 OCPU / 1 GB（AMD 微型规格固定，不可调）</span>
                  </el-form-item>

                  <el-form-item :label="'引导卷：' + createForm.boot_gb + ' GB（最小 ' + opts.min_boot_gb + 'GB）'">
                    <el-slider v-model="createForm.boot_gb" :min="50" :max="200" :step="5"
                               @change="runPreflight" style="width:100%;" />
                  </el-form-item>

                  <el-form-item label="可用域">
                    <el-select v-model="createForm.availability_domain" style="width:100%;"

                    </el-select>
                  </el-form-item>

                  <el-form-item label="系统镜像（只列 Ubuntu）">

                               :loading="optsLoading" placeholder="选择 Ubuntu 镜像">
                      <el-option v-for="im in opts.images" :key="im.id" :value="im.id"
                                 :label="im.display_name" />
                    </el-select>
                  </el-form-item>

                  <el-form-item label="网络">
                    <div style="width:100%;">
                      <el-checkbox v-model="createForm.assign_ipv6" label="同时分配 IPv6 地址" />
                      <el-checkbox v-model="createForm.open_all_ports" label="创建后自动放行所有端口" />
                      <p class="hint" style="margin-top:4px;">
                        子网由面板统一管理，所有实例共用一个。这个账户还没有网络的话，
                        创建时会自动建好 VCN、网关和子网。勾选 IPv6 会自动开通子网 IPv6 并分配地址。<br />
                        <b style="color:var(--warn);">放行所有端口</b>会给子网加一条任何来源任何端口的入站规则，
                        <b>同子网下所有实例都会被放开</b>；有 IPv6 时 <code>::/0</code> 一并放行。
                        实例内部的 iptables 仍需你自己开。
                      </p>
                    </div>
                  </el-form-item>

                  <el-form-item label="SSH 公钥">
                    <div style="width:100%;">
                      <el-input v-model="createForm.ssh_public_key" type="textarea" :rows="3" class="mono"

                      <div style="margin-top:8px; display:flex; align-items:center; gap:10px;">

                        <input ref="pubkeyInput" type="file" accept=".pub,.txt,text/plain"
                               style="display:none;" @change="onPubKeyFile" />
                        <span class="hint" v-if="pubKeyName">已导入 {{ pubKeyName }}</span>
                      </div>
                    </div>
                  </el-form-item>
                </el-form>
                <p class="hint">
                  选 <code>~/.ssh/id_ed25519.pub</code> 这类 .pub 文件，不是私钥。创创建完成后成后用
                  <code class="mono">ssh ubuntu@公网IP</code> 登录。
                </p>
              </div>

              <!-- 额度预检 -->
              <div>
                <div class="pf-card" :class="preflight && preflight.allow ? 'ok' : (preflight ? 'bad' : '')">
                  <div class="pf-head">
                    <span class="card-title">额度预检</span>
                    <span class="state" v-if="preflight">
                      <i :class="['dot', preflight.allow ? 'ok' : 'crit']"></i>
                      <span class="state-label">{{ preflight.allow ? '可以创建' : '超出额度' }}</span>

                    <span class="who" v-else-if="preflightLoading">核算中…</span>
                  </div>

                  <template v-if="preflight">

                      <span class="pf-calc mono">
                        {{ c.current }} <em>+{{ c.adding }}</em> = <b>{{ c.after }}</b> / {{ c.limit }}{{ c.unit }}
                      </span>
                    </div>

                    <div class="pf-msg crit" v-for="(b,i) in preflight.blockers" :key="'b'+i">{{ b }}</div>
                    <div class="pf-msg warn" v-for="(w,i) in preflight.warnings" :key="'w'+i">{{ w }}</div>
                  </template>
                  <div class="empty" v-else-if="!preflightLoading" style="padding:20px 8px;">

                </div>

                  ARM 遇到「Out of host capacity」是 Oracle 侧没库存，面板只报错，不会自动循环重试。
                </p>
              </div>
            </div>
          </div>
        </section>

            </div>
            <div v-if="tier.tier" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">

            </div>
            <div v-else-if="!tierLoading" class="hint" style="margin-top:0;">

            <ul class="hint" v-if="tier.reasons && tier.reasons.length" style="margin:8px 0 0; padding-left:18px;">
              <li v-for="(r,i) in tier.reasons" :key="i">{{ r }}</li>
            </ul>
            <p class="hint" v-if="tier.tier">
              Oracle 没有给普通租户一个直白的等级标志位，这里是综合订阅信息和服务限额推断的，
              依据已列在上面，可以自行核对。
            </p>
          </div>

          <div class="card" v-if="loading && !usage" aria-label="加载中">
            <div class="skel skel-row" v-for="i in 6" :key="i"></div>
          </div>
          <div class="card" v-else-if="usage">

              <div class="card-title">当前用量 / Always Free 上限</div>
            </div>
            <el-alert v-for="(w,i) in usage.warnings" :key="i" type="error" show-icon :closable="false"
                      :title="w" style="margin-bottom:8px;" />
            <div class="quota" v-for="it in usage.items" :key="it.label">
              <div class="label">{{ it.label }}</div>
              <div :class="['bar', it.over ? 'over' : (it.percent >= 80 ? 'warn' : '')]">
                <i :style="{ width: Math.min(it.percent,100) + '%' }"></i>
              </div>
              <div class="num"><b>{{ it.used }}</b> / {{ it.limit }} {{ it.unit }}</div>
            </div>
            <p class="hint">
              上限对照 Oracle Always Free 公开文档，仅供参考，以控制台实际配额为准。
              引导卷同样占用 200GB 存储额度，所以这里把引导卷和块存储合并计算。
            </p>
          </div>
          <div class="card empty" v-else-if="!loading">
            <b>还没有额度数据</b>
            选一个账户后点击「刷新」。
          </div>

        <section class="pane" v-show="activeTab === 'storage'">
          <div class="card">
            <div class="card-head">

                  </el-table-column>
                  <el-table-column prop="display_name" label="名称" min-width="170" show-overflow-tooltip />
                  <el-table-column label="类型" width="90">
                    <template #default="{row}">{{ row.kind === 'boot' ? '引导卷' : '块存储' }}</template>
                  </el-table-column>
                  <el-table-column label="大小" width="90">
                    <template #default="{row}"><span class="mono">{{ row.size_gb }} GB</span></template>
                  </el-table-column>
                  <el-table-column label="性能 (VPU/GB)" width="210">

                        <el-input-number :model-value="row.vpus_per_gb" size="small"

                        </span>
                      </div>
                    </template>
                  </el-table-column>
                  <el-table-column label="创建于" width="110">
                    <template #default="{row}"><span class="mono">{{ fmtDate(row.time_created) }}</span></template>
                  </el-table-column>

                    <template #default="{row}">
                      <el-button size="small" type="danger" :disabled="!row.orphan"

        <!-- 防火墙 -->
        <section class="pane" v-show="activeTab === 'firewall'">
          <div class="card">
            <div class="card-head">

            </div>
            <div class="toolbar">
              <el-select v-model="fwInstance" placeholder="选择实例" style="width:280px;" @change="loadFirewall">
                <el-option v-for="i in instances" :key="i.id" :value="i.id"

              </el-select>
              <el-button @click="loadFirewall" :loading="fwLoading" :disabled="!fwInstance">刷新</el-button>
            </div>

            <template v-if="firewall">
              <div class="fw-verdict" :class="firewall.all_open_v4 ? 'open' : 'partial'">

                <div>
                  <b>{{ firewall.verdict }}</b>
                  <span class="mono">子网 {{ firewall.subnet_name }}

                </div>
                <div class="fw-actions">
                  <el-button v-if="!firewall.all_open_v4" type="warning" :loading="fwBusy"
                             @click="allowAll">放行全部端口</el-button>
                  <el-button v-else type="primary" plain :loading="fwBusy"
                             @click="revokeAll">撤销全放行</el-button>
                  <el-button plain :loading="fwBusy" @click="clearRules">清空规则</el-button>
                </div>
              </div>

              <div class="table-wrap" v-if="firewall.ingress_rules.length">
                <el-table :data="firewall.ingress_rules" size="small" stripe border style="width:100%;">
                  <el-table-column label="协议" width="110">
                    <template #default="{row}"><span class="mono">{{ row.protocol }}</span></template>
                  </el-table-column>
                  <el-table-column label="来源" width="160">
                    <template #default="{row}"><span class="mono">{{ row.source }}</span></template>
                  </el-table-column>
                  <el-table-column label="端口" width="140">
                    <template #default="{row}"><span class="mono">{{ row.ports }}</span></template>
                  </el-table-column>
                  <el-table-column label="说明" min-width="180">
                    <template #default="{row}">{{ row.description || '—' }}</template>
                  </el-table-column>
                  <el-table-column label="操作" width="88" fixed="right">
                    <template #default="{ $index }">
                      <el-button size="small" text class="term-btn" :loading="fwBusy"
                                 @click="deleteRule($index)">删除</el-button>
                    </template>
                  </el-table-column>
                </el-table>
              </div>
              <div class="empty" v-else><b>没有任何入站规则</b>该实例目前从公网完全不可达。</div>

              <div class="card-head" style="margin-top:18px;">
                <div class="card-title">新增入站规则</div>
              </div>
              <div class="rule-form">
                <el-select v-model="ruleForm.protocol" style="width:104px;" size="default">
                  <el-option v-for="p in ['TCP','UDP','ICMP','ALL']" :key="p" :value="p" :label="p" />
                </el-select>
                <el-input-number v-model="ruleForm.port_from" :min="1" :max="65535"
                                 :disabled="ruleForm.protocol === 'ICMP' || ruleForm.protocol === 'ALL'"
                                 controls-position="right" style="width:118px;" />
                <span class="rule-sep">至</span>
                <el-input-number v-model="ruleForm.port_to" :min="1" :max="65535"
                                 :disabled="ruleForm.protocol === 'ICMP' || ruleForm.protocol === 'ALL'"
                                 controls-position="right" style="width:118px;" />
                <el-select v-model="ruleForm.source" style="width:158px;" filterable allow-create>
                  <el-option value="0.0.0.0/0" label="0.0.0.0/0（任意 IPv4）" />
                  <el-option value="::/0" label="::/0（任意 IPv6）" />
                </el-select>
                <el-button type="primary" :loading="fwBusy" @click="addRule">添加</el-button>
              </div>
              <p class="hint" style="margin-top:6px;">
                常用端口：HTTP 80、HTTPS 443、SSH 22。端口范围相同即表示单个端口。
              </p>

              <el-alert type="warning" show-icon :closable="false" style="margin-top:14px;"
                        title="放行后如果端口还是不通，是实例内部的防火墙在挡"
                        description="Oracle 的 Ubuntu 镜像自带 iptables 规则，默认只放 22。安全列表只是云端这一层，两层都要开。" />
              <p class="hint">
                实例内执行（Ubuntu）：<br />
                <code>sudo iptables -I INPUT -j ACCEPT &amp;&amp; sudo netfilter-persistent save</code><br />
                只想开单个端口更稳妥：<code>sudo iptables -I INPUT -p tcp --dport 80 -j ACCEPT</code>
              </p>
            </template>
            <div class="empty" v-else-if="!fwLoading">
              <b>选一台实例查看防火墙状态</b>

            </div>
          </div>
        </section>

        <!-- 监控 -->
        <section class="pane" v-show="activeTab === 'metrics'">

            <div class="card-head">
              <div class="card-title">实例指标</div>
            </div>
            <div class="toolbar">
              <el-select v-model="metricInstance" placeholder="选择实例" style="width:260px;" @change="loadMetrics">
                <el-option v-for="i in instances" :key="i.id" :value="i.id" :label="i.display_name" />
              </el-select>
              <div class="seg" role="group" aria-label="时间范围">

              <el-button @click="loadMetrics" :loading="metricsLoading" :disabled="!metricInstance">查询</el-button>
            </div>

            <template v-if="hasMetricPoints">
              <div class="legend">
                <span v-for="s in chartSeries" :key="s.metric">

                </span>
              </div>
              <div class="chart" @mousemove="onChartMove" @mouseleave="hoverIdx = -1">
                <svg :viewBox="'0 0 ' + CW + ' ' + CH" role="img"
                     :aria-label="'过去 ' + metricHours + ' 小时的 CPU 与内存利用率折线图'">
                  <line class="grid" v-for="g in gridLines" :key="g.y" x1="46" :y1="g.y" :x2="CW-8" :y2="g.y" />
                  <text class="axis-t" v-for="g in gridLines" :key="'t'+g.y" x="40" :y="g.y+3" text-anchor="end">{{ g.label }}</text>
                  <path v-for="s in areaSeries" :key="'a'+s.metric" :d="s.area" :fill="s.color" fill-opacity="0.16" />
                  <path v-for="s in chartSeries" :key="'l'+s.metric" :d="s.line" fill="none" :stroke="s.color"
                        stroke-width="1.8" :stroke-dasharray="s.dash ? '5 4' : ''" vector-effect="non-scaling-stroke"
                        stroke-linejoin="round" />
                  <line v-if="hoverIdx >= 0" class="grid" :x1="hoverX" y1="8" :x2="hoverX" :y2="CH-20"
                        stroke="#38bdf8" stroke-dasharray="3 3" />
                  <text class="axis-t" x="46" :y="CH-6">{{ axisStart }}</text>
                  <text class="axis-t" :x="CW-8" :y="CH-6" text-anchor="end">{{ axisEnd }}</text>
                </svg>
                <div class="readout" v-if="hoverIdx >= 0">
                  <div style="color:var(--muted);">{{ hoverTime }}</div>
                  <div v-for="s in chartSeries" :key="'r'+s.metric" :style="{ color: s.color }">
                    {{ s.name }} {{ hoverValue(s) }}
                  </div>
                </div>
              </div>
            </template>

            <div class="table-wrap" style="margin-top:16px;" v-if="metrics.length">
              <el-table :data="metrics" size="small" stripe border style="width:100%;">
                <el-table-column prop="name" label="指标" width="120" />

                  <template #default="{row}"><span class="mono">{{ fmtPct(row.latest) }}</span></template>
                </el-table-column>
                <el-table-column label="平均" width="90">
                  <template #default="{row}"><span class="mono">{{ fmtPct(row.avg) }}</span></template>
                </el-table-column>
                <el-table-column label="峰值" width="90">
                  <template #default="{row}"><span class="mono">{{ fmtPct(row.max) }}</span></template>

                <el-table-column label="数据点" width="90">

                    <span style="color:var(--muted);" v-else>该指标没有数据</span>
                  </template>
                </el-table-column>
              </el-table>
            </div>
            <div class="empty" v-else-if="!metricsLoading">

        <section class="pane" v-show="activeTab === 'password'">
          <div class="card" style="max-width:420px;">

            <el-form label-position="top" @submit.prevent>

            <div class="card-head"><div class="card-title">密码有效期</div></div>

            <el-alert v-if="pwPolicy.expired" type="error" show-icon :closable="false"

<script>
// 本地资源优先；下不到再退到公共 CDN，保证离线构建和本地开发都能起来。
(function () {
  var CDN = {
    'vue.global.prod.js': ['https://unpkg.com/vue@3/dist/vue.global.prod.js',
                           'https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js'],
    'element-plus.full.min.js': ['https://unpkg.com/element-plus/dist/index.full.min.js',
                                 'https://cdn.jsdelivr.net/npm/element-plus/dist/index.full.min.js'],
    'axios.min.js': ['https://unpkg.com/axios/dist/axios.min.js',
                     'https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js'],
    'element-plus.css': ['https://unpkg.com/element-plus/dist/index.css'],
    'element-plus-dark.css': ['https://unpkg.com/element-plus/theme-chalk/dark/css-vars.css']
  };
  function loadScript(url) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = url; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  function chain(urls) {
    return urls.reduce(function (p, u) {
      return p.catch(function () { return loadScript(u); });
    }, Promise.reject());
  }
  function loadStyle(url) {
    return new Promise(function (res) {
      var l = document.createElement('link');
      l.rel = 'stylesheet'; l.href = url;
      l.onload = res; l.onerror = res;   // 样式挂了也别卡住启动
      document.head.appendChild(l);
    });
  }
  // 探针：Element Plus 给 .el-button 的 display 是 inline-flex，
  // 拿到别的值就说明它的样式压根没加载。
  function stylesMissing() {
    var probe = document.createElement('div');
    probe.className = 'el-button';
    probe.style.position = 'absolute';
    probe.style.visibility = 'hidden';
    document.documentElement.appendChild(probe);
    var display = getComputedStyle(probe).display;
    probe.remove();
    return display !== 'inline-flex';
  }
  window.__ocixBoot = (async function () {
    for (var name of ['vue.global.prod.js', 'element-plus.full.min.js', 'axios.min.js']) {
      try { await loadScript('/assets/' + name); } catch (e) { await chain(CDN[name]); }
    }
    // 本地样式没下到时补 CDN 样式。
    // 注意别用 link.sheet 判断：本地文件 404 时它依然是个非空对象，
    // 这个判断永远为真，等于回退从来不生效，缺资源时整个面板是裸样式的。
    // 只能实际量一下样式有没有生效。
    if (stylesMissing()) {
      await Promise.all(['element-plus.css', 'element-plus-dark.css'].map(function (n) {
        return loadStyle(CDN[n][0]);
      }));
    }
  })();
})();
</script>

const NAME_ENV = ['prod', 'stg', 'live', 'core', 'main'];
function randomName() {

  const d = pick(NAME_DOMAIN), r = pick(NAME_ROLE);
  switch (Math.floor(Math.random() * 3)) {
    case 0: return `${d}-${r}-${nn}`;

}

createApp({
  template: document.getElementById('app-tpl').innerHTML,
  setup() {
    // ---- 会话 ----
    const token = ref(localStorage.getItem('ocix_token') || '');
    const user = ref(localStorage.getItem('ocix_user') || '');
    const loginForm = reactive({ username: '', password: '' });
    const loginErr = ref('');
    const loading = ref(false);

    // ---- 账户 / 范围 ----
    const profiles = ref([]);
    const profilesLoading = ref(false);
    const currentProfile = ref(localStorage.getItem('ocix_profile') || '');
    const compartments = ref([]);
    const compsLoading = ref(false);
    const compartmentId = ref('');
    const subtree = ref(false);
    const activeTab = ref('all');
    const lastUpdated = ref('');

    // ---- 数据 ----
    const instances = ref([]);
    const instSelection = ref([]);
    const instTableRef = ref(null);
    const usage = ref(null);
    const tier = ref({});
    const tierLoading = ref(false);
    const allAccounts = ref([]);
    const allWithIp = ref(false);
    const allSelection = ref([]);
    const allTableRef = ref(null);
    const allSummary = ref({ accounts: 0, instances: 0, running: 0, stopped: 0, failed_accounts: 0 });

    const metrics = ref([]);
    const metricInstance = ref('');
    const metricHours = ref(1);
    const metricsLoading = ref(false);
    const hoverIdx = ref(-1);

    const importForm = reactive({
      profile_name: '', config_text: '', key_mode: 'file',
      key_text: '', pass_phrase: '', file: null,
    });
    const importing = ref(false);
    const pw = reactive({ old_password: '', new_password: '' });

    // ---- 新建实例 ----
    const AMD_SHAPE = 'VM.Standard.E2.1.Micro';
    const opts = ref({
      availability_domains: [], images: [], subnets: [], shapes: [],
      limits: {}, min_boot_gb: 50, arm_gb_per_ocpu: 6, needs_network: false,
    });
    const optsLoading = ref(false);
    const creating = ref(false);
    const preflight = ref(null);
    const preflightLoading = ref(false);
    const createForm = reactive({
      display_name: randomName(), shape: 'VM.Standard.A1.Flex',
      ocpus: 4, memory_gb: 24, boot_gb: 50,
      availability_domain: '', image_id: '', ssh_public_key: '',
      assign_ipv6: false, open_all_ports: true,
    });
    const pubKeyName = ref('');
    // 存的是正在加 IPv6 的实例 id，用来只给那一行显示 loading
    const ipv6Busy = ref('');

    function rollName() { createForm.display_name = randomName(); }

    function onPubKeyFile(e) {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        const text = String(reader.result || '').trim();

          ElMessage.error('这是私钥文件，请选 .pub 结尾的公钥');

          return;
        }
        createForm.ssh_public_key = text;
        pubKeyName.value = f.name;
        ElMessage.success(`已导入 ${f.name}`);
      };
      reader.onerror = () => ElMessage.error('读取文件失败');
      reader.readAsText(f);
      e.target.value = '';
    }

    async function addIpv6(row) {
      const profile = row.profile || currentProfile.value;
      try {
        await ElMessageBox.confirm(
          `给「${row.display_name}」添加 IPv6 地址？\n` +
          `子网还没开通 IPv6 的话会一并开通，并放行 ::/0 的 SSH 入站。`,
          '添加 IPv6',
          { type: 'info', confirmButtonText: '添加', cancelButtonText: '取消',
            customStyle: { whiteSpace: 'pre-wrap' } });
      } catch { return; }
      ipv6Busy.value = row.id;
      try {
        const { data } = await axios.post('/api/provision/instances/add-ipv6', {
          profile, instance_id: row.id, compartment_id: row.compartment_id,
        });
        if (data.changed) {
          ElMessage.success(`已分配 IPv6：${data.ipv6}`);
          ElMessageBox.alert(
            `地址 ${data.ipv6} 已分配到网卡。\n\n` +
            `如果实例内 ping 不通 IPv6，在实例内执行一次：\n` +
            `sudo dhclient -6 或直接重启实例。`,
            'IPv6 已添加',
            { type: 'success', customStyle: { whiteSpace: 'pre-wrap' } });
        } else {
          ElMessage.info(`该实例已经有 IPv6：${data.ipv6}`);
        }
        (data.warnings || []).forEach(w => ElMessage.warning(w));
        await loadSingle();
      } catch (e) {
        ElMessage.error(errMsg(e, '添加 IPv6 失败'));
      } finally { ipv6Busy.value = ''; }
    }

    // ---- 防火墙 ----
    const firewall = ref(null);
    const fwInstance = ref('');
    const fwLoading = ref(false);
    const fwBusy = ref(false);
    const ruleForm = reactive({ protocol: 'TCP', port_from: 80, port_to: 80, source: '0.0.0.0/0' });

    // 卷性能：0-120 VPU/GB，步长 10
    const vpuRange = computed(() => opts.value.vpu_range ||
      { min: 0, max: 120, step: 10, free_max: 10 });
    function vpuTier(v) {
      if (v <= 0) return '较低成本';
      if (v <= 10) return '均衡';
      if (v <= 20) return '较高性能';
      return '超高性能';
    }
    const isArm = computed(() => createForm.shape !== AMD_SHAPE);
    const canCreate = computed(() =>
      !!(preflight.value && preflight.value.allow && createForm.display_name &&
         createForm.availability_domain && createForm.image_id &&
         createForm.ssh_public_key));

    // ---- 一键更新状态 ----
    const upd = ref({});
    const updBusy = ref(false);
    let updTimer = null;

    // ---- 密码有效期 ----
    const pwPolicy = ref({ max_age_days: 0, days_left: null, expired: false });

    // ---- 版本 / 更新 ----
    const sys = ref({ current: '', latest: null, update_available: false,
                      install_dir: '/opt/ocix', update_command: '', check_command: '' });
    const sysLoading = ref(false);

    // ---- 存储 ----
    const storage = ref(null);
    const storageLoading = ref(false);

    const auditLogs = ref([]);
    const auditTotal = ref(0);
    const auditActions = ref([]);
    const auditPage = ref(1);
    const auditSize = 20;
    const auditLoading = ref(false);
    const auditFilter = reactive({ action: '', result: '' });

    // ---- HTTP ----
    // 在途请求计数 -> 顶部进度条。任何一次请求都会让它出现，
    // 点了按钮立刻能看到「在跑」，不至于以为没反应。
    const netBusy = ref(false);
    let inflight = 0;
    const settle = () => {
      inflight = Math.max(0, inflight - 1);
      if (!inflight) netBusy.value = false;
    };
    axios.interceptors.request.use((cfg) => { inflight++; netBusy.value = true; return cfg; });
    axios.interceptors.response.use(
      (r) => { settle(); return r; },
      (e) => { settle(); return Promise.reject(e); });

    function applyToken(t) {
      axios.defaults.headers.common['Authorization'] = t ? 'Bearer ' + t : '';
    }
    applyToken(token.value);
    let pwRedirected = false;
    axios.interceptors.response.use(null, (err) => {
      const res = err.response;
      if (res && res.status === 401 && token.value) {
        clearSession();
        ElMessage.warning('登录已失效，请重新登录');
      }
      // 密码过期后所有业务接口都会 403。不引导的话用户只会看到满屏报错，
      // 却不知道去哪改密——直接把他送到密码页。
      if (res && res.status === 403 && res.headers &&
          res.headers['x-ocix-password-expired'] === '1') {
        if (!pwRedirected) {
          pwRedirected = true;
          ElMessage.error(errMsg(err, '密码已过期，请先修改密码'));
          activeTab.value = 'password';
          loadPwPolicy();
          setTimeout(() => { pwRedirected = false; }, 3000);
        }
      }
      return Promise.reject(err);
    });
    const errMsg = (e, fallback) => {
      const d = e && e.response && e.response.data && e.response.data.detail;
      if (!d) return fallback;
      if (typeof d === 'string') return d;
      // 后端已把校验错误拍平成字符串，这里只是兜底：
      // 真拿到数组还直接塞进弹窗的话，用户看到的是 [object Object]
      if (Array.isArray(d)) {
        const s = d.map(x => (x && x.msg) || '').filter(Boolean).join('；');
        return s || fallback;
      }
      return d.msg || fallback;
    };

    // ---- 登录 ----
    async function doLogin() {
      if (!loginForm.username || !loginForm.password) {
        loginErr.value = '请填写用户名和密码'; return;
      }
      loginErr.value = ''; loading.value = true;
      try {
        const { data } = await axios.post('/api/auth/login', { ...loginForm });
        token.value = data.token; user.value = data.user;
        localStorage.setItem('ocix_token', data.token);
        localStorage.setItem('ocix_user', data.user);
        applyToken(data.token);
        loginForm.password = '';

      } catch (e) {
        loginErr.value = errMsg(e, '登录失败，请检查用户名和密码');
      } finally { loading.value = false; }

      token.value = ''; user.value = '';

    async function loadCompartments() {
      compartments.value = [];

        const { data } = await axios.get('/api/instances/compartments', {
          params: { profile: currentProfile.value },

    function scopeParams() {
      const p = { profile: currentProfile.value, subtree: subtree.value };

    async function loadSingle(withUsage) {

        // 在实例页顺带查一遍会多花 6 次 OCI 请求
        const reqs = [axios.get('/api/instances', { params: { ...scopeParams(), with_ip: true } })];
        if (withUsage) {
          reqs.push(axios.get('/api/monitor/usage', { params: scopeParams() })
            .catch(() => ({ data: null })));
        }
        const [inst, usg] = await Promise.all(reqs);
        instances.value = inst.data.instances;
        if (withUsage) usage.value = usg.data;
        stamp();
      } catch (e) {
        ElMessage.error(errMsg(e, '实例加载失败'));
      } finally { loading.value = false; }
    }

    async function loadAll() {
      loading.value = true;
      try {
        const { data } = await axios.get('/api/instances/all', {
          params: { subtree: subtree.value, with_ip: allWithIp.value },
        });
        allAccounts.value = data.accounts;

    async function batchAct(rows, action) {
      const label = ACTION_LABEL[action] || action;
      const targets = rows.map(r => ({
        profile: r.profile || currentProfile.value,
        instance_id: r.id,
        display_name: r.display_name,
      }));
      try {
        await ElMessageBox.confirm(
          `对选中的 ${targets.length} 台实例执行${label}？`, `确认批量${label}`,
          { type: 'warning', confirmButtonText: `${label} ${targets.length} 台`, cancelButtonText: '取消' });
      } catch { return; }
      loading.value = true;
      try {
        const { data } = await axios.post('/api/instances/batch-action', { action, targets });
        if (data.failed === 0) {
          ElMessage.success(`${targets.length} 台已发送${label}指令`);
        } else {
          const bad = data.results.filter(r => !r.ok);
          ElMessageBox.alert(
            bad.map(r => `${r.display_name || r.instance_id}：${r.error}`).join('\n'),
            `${data.succeeded} 台成功，${data.failed} 台失败`,
            { type: 'warning', customStyle: { whiteSpace: 'pre-wrap', maxWidth: '560px' } });
        }
        clearAllSelection(); clearInstSelection();
        await refreshAfterAction();
      } catch (e) {
        ElMessage.error(errMsg(e, `批量${label}失败`));
      } finally { loading.value = false; }
    }

    async function refreshAfterAction() {
      if (activeTab.value === 'all') return loadAll();
      return loadSingle();
    }

    function clearInstSelection() { instSelection.value = []; instTableRef.value?.clearSelection(); }
    function clearAllSelection() { allSelection.value = []; allTableRef.value?.clearSelection(); }

    // ---- 配置管理 ----
    function onKeyFile(file) { importForm.file = file.raw; }

    async function importProfile() {
      if (!importForm.config_text.trim()) { ElMessage.warning('请先粘贴配置内容'); return; }
      importing.value = true;
      const fd = new FormData();
      fd.append('config_text', importForm.config_text);
      if (importForm.profile_name) fd.append('profile_name', importForm.profile_name);
      if (importForm.pass_phrase) fd.append('pass_phrase', importForm.pass_phrase);
      if (importForm.key_mode === 'file' && importForm.file) fd.append('key_file', importForm.file);
      if (importForm.key_mode === 'text' && importForm.key_text.trim()) fd.append('key_text', importForm.key_text);
      try {
        const { data } = await axios.post('/api/profiles/import', fd);
        ElMessage.success(`账户 ${data.profile} 已导入并校验通过`);
        importForm.config_text = ''; importForm.profile_name = '';
        importForm.key_text = ''; importForm.pass_phrase = ''; importForm.file = null;
        await loadProfiles();
        currentProfile.value = data.profile;
        onProfileChange();
        loadAll();
      } catch (e) {
        ElMessage.error(errMsg(e, '导入失败'));
      } finally { importing.value = false; }
    }

    async function testProfile(name) {
      loading.value = true;
      try {
        const { data } = await axios.post(`/api/profiles/${encodeURIComponent(name)}/test`);
        ElMessage.success(`${name} 可用${data.user_name ? '，当前用户 ' + data.user_name : ''}`);
        await loadProfiles();
      } catch (e) {
        ElMessage.error(errMsg(e, `${name} 校验失败`));
      } finally { loading.value = false; }
    }

    async function delProfile(name) {
      try {
        await ElMessageBox.confirm(
          `删除账户「${name}」？面板里的配置和私钥会一起清掉，OCI 上的资源不受影响。`,
          '确认删除', { type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消' });
      } catch { return; }
      try {
        await axios.delete('/api/profiles/' + encodeURIComponent(name));
        ElMessage.success(`账户 ${name} 已删除`);
        await loadProfiles();
        onProfileChange();
        loadAll();
      } catch (e) { ElMessage.error(errMsg(e, '删除失败')); }
    }

    async function purgeAudit() {
      try {
        await ElMessageBox.confirm('清空全部审计日志？这一步不可撤销。', '确认清空',
          { type: 'warning', confirmButtonText: '清空', cancelButtonText: '取消' });
      } catch { return; }
      try {
        const { data } = await axios.delete('/api/audit', { params: { keep_days: 0 } });
        ElMessage.success(`已清空 ${data.deleted} 条记录`);
        loadAudit(1);
      } catch (e) { ElMessage.error(errMsg(e, '清空失败')); }
    }

    const updRunning = computed(() =>
      upd.value.state === 'running' || upd.value.state === 'pending' || upd.value.queued);
    const updStateText = computed(() => ({
      pending: '排队中', running: '更新中', done: '已完成', failed: '失败',
    }[upd.value.state] || ''));
    const updTagType = computed(() => ({
      done: 'success', failed: 'danger', running: 'warning', pending: 'info',
    }[upd.value.state] || 'info'));

    async function loadUpdateStatus() {
      try {
        const { data } = await axios.get('/api/system/update/status');
        const wasRunning = updRunning.value;
        upd.value = data;
        // 更新完成后版本号变了，把版本卡片一起刷新
        if (wasRunning && !updRunning.value) {
          if (data.state === 'done') ElMessage.success(`已更新到 v${data.version}`);
          if (data.state === 'failed') ElMessage.error('更新失败，展开日志看原因');
          loadSystem(false);
        }
      } catch (e) {
        // 更新时容器正在重启，请求失败是预期内的，别弹错误吓人
      }
    }

    function watchUpdate(on) {
      if (updTimer) { clearInterval(updTimer); updTimer = null; }
      if (on) updTimer = setInterval(loadUpdateStatus, 3000);
    }

    async function doUpdate() {
      try {
        await ElMessageBox.confirm(
          '现在更新到最新版？\n' +
          '过程中面板会重启，大约需要一两分钟。配置、密码和审计记录都不会动。',
          '确认更新',
          { type: 'warning', confirmButtonText: '开始更新', cancelButtonText: '再想想',
            customStyle: { whiteSpace: 'pre-wrap' } });
      } catch { return; }
      updBusy.value = true;
      try {
        const { data } = await axios.post('/api/system/update');
        upd.value = { ...upd.value, state: data.state, message: data.msg };
        ElMessage.success(data.msg);
        watchUpdate(true);
      } catch (e) {
        ElMessage.error(errMsg(e, '发起更新失败'));
      } finally { updBusy.value = false; }
    }

    async function loadTier(force) {
      if (!currentProfile.value) return;
      if (tier.value.tier && !force) return;
      tierLoading.value = true;
      try {
        const { data } = await axios.get(
          `/api/profiles/${encodeURIComponent(currentProfile.value)}/tier`);
        tier.value = data;
      } catch (e) {
        tier.value = {};
        ElMessage.error(errMsg(e, '账户等级检测失败'));
      } finally { tierLoading.value = false; }
    }

    async function loadPwPolicy() {
      try {
        const { data } = await axios.get('/api/auth/password-policy');
        pwPolicy.value = data;
      } catch (e) { /* 拿不到就按不限制显示，不打扰 */ }
    }

    async function savePwPolicy() {
      loading.value = true;
      try {
        const { data } = await axios.put('/api/auth/password-policy',
                                         { max_age_days: pwPolicy.value.max_age_days });
        pwPolicy.value = data;
        ElMessage.success(data.max_age_days === 0
          ? '已设为永不过期' : `密码有效期已设为 ${data.max_age_days} 天`);
      } catch (e) { ElMessage.error(errMsg(e, '保存失败')); }
      finally { loading.value = false; }
    }

    async function changePw() {
      if (pw.new_password.length < 8) { ElMessage.warning('新密码至少 8 位'); return; }
      loading.value = true;
      try {
        await axios.post('/api/auth/change-password', { ...pw });
        ElMessage.success('密码已更新，请用新密码重新登录');
        pw.old_password = ''; pw.new_password = '';
        clearSession();
      } catch (e) { ElMessage.error(errMsg(e, '修改失败')); }
      finally { loading.value = false; }
    }

    // ---- 展示 ----
    const allFlat = computed(() =>
      allAccounts.value.flatMap(a => a.instances.map(i => ({ ...i, profile: a.profile }))));
    const failedAccounts = computed(() => allAccounts.value.filter(a => a.error));

    const STATE_TONE = {
      RUNNING: 'ok', STOPPED: 'idle',
      STARTING: 'warn', STOPPING: 'warn', PROVISIONING: 'warn', CREATING_IMAGE: 'warn', MOVING: 'warn',
    };
    const STATE_TEXT = {
      RUNNING: '运行中', STOPPED: '已停止', STARTING: '启动中', STOPPING: '停止中',
      PROVISIONING: '创建中', TERMINATED: '已终止', TERMINATING: '终止中', MOVING: '迁移中',
      CREATING_IMAGE: '制作镜像',
    };
    const stateTone = (s) => STATE_TONE[s] || 'crit';
    const stateText = (s) => STATE_TEXT[s] || s || '未知';

    function specText(row) {
      const parts = [row.shape || '—'];
      if (row.ocpus) parts.push(`${row.ocpus} OCPU`);
      if (row.memory_gb) parts.push(`${row.memory_gb} GB`);
      return parts.join(' · ');
    }
    const fmtPct = (v) => (v === null || v === undefined ? '—' : v.toFixed(1) + '%');
    function fmtDate(s) {
      if (!s) return '—';
      const d = new Date(s);
      return isNaN(d) ? '—' : d.toLocaleDateString('zh-CN');
    }
    function fmtTime(s) {
      if (!s) return '—';
      const d = new Date(s);
      return isNaN(d) ? '—' : d.toLocaleString('zh-CN', { hour12: false });
    }
    function fmtUtc(s) {
      if (!s) return '—';
      // SQLite datetime('now') 是 UTC，补上时区标记再转本地
      const d = new Date(s.replace(' ', 'T') + 'Z');
      return isNaN(d) ? s : d.toLocaleString('zh-CN', { hour12: false });
    }
    async function copy(text) {
      try {
        await navigator.clipboard.writeText(text);
        ElMessage.success(`已复制 ${text}`);
      } catch {
        ElMessage.warning('浏览器拒绝了复制，请手动选中');
      }
    }

    // ---- 折线图（点数不过千，内联 SVG 足够，也免掉一个图表库依赖）----
    const SERIES_STYLE = {
      CpuUtilization: { color: '#38bdf8', dash: false },
      MemoryUtilization: { color: '#a78bfa', dash: true },
    };
    const withPoints = computed(() => metrics.value.filter(m => m.points && m.points.length > 1));
    const hasMetricPoints = computed(() => withPoints.value.length > 0);
    const axisPoints = computed(() => {
      let best = [];
      withPoints.value.forEach(m => { if (m.points.length > best.length) best = m.points; });
      return best;
    });
    const yMax = computed(() => {
      let max = 0;
      withPoints.value.forEach(m => m.points.forEach(p => { if (p.v > max) max = p.v; }));
      return Math.max(100, Math.ceil(max / 20) * 20);
    });
    const xAt = (i, n) => PAD_L + (n <= 1 ? 0 : (i / (n - 1)) * (CW - PAD_L - PAD_R));
    const yAt = (v) => PAD_T + (1 - v / yMax.value) * (CH - PAD_T - PAD_B);

    const chartSeries = computed(() => withPoints.value.map(m => {
      const style = SERIES_STYLE[m.metric] || { color: '#94a3b8', dash: false };
      const n = m.points.length;
      const coords = m.points.map((p, i) => [xAt(i, n), yAt(p.v)]);
      const line = coords.map((c, i) => (i ? 'L' : 'M') + c[0].toFixed(1) + ' ' + c[1].toFixed(1)).join(' ');
      const base = (CH - PAD_B).toFixed(1);
      const area = `${line} L${coords[n - 1][0].toFixed(1)} ${base} L${coords[0][0].toFixed(1)} ${base} Z`;
      return { metric: m.metric, name: m.name, color: style.color, dash: style.dash, line, area, points: m.points };
    }));

    // 只给实线系列铺面积，虚线系列叠面积会糊成一片
    const areaSeries = computed(() => chartSeries.value.filter(s => !s.dash));

    const gridLines = computed(() => {
      const step = yMax.value / 4;
      return [0, 1, 2, 3, 4].map(k => ({
        y: +yAt(k * step).toFixed(1),
        label: Math.round(k * step) + '%',
      }));
    });
    const axisStart = computed(() => {
      const p = axisPoints.value[0];
      return p ? shortTime(p.t) : '';
    });
    const axisEnd = computed(() => {
      const p = axisPoints.value[axisPoints.value.length - 1];
      return p ? shortTime(p.t) : '';
    });
    function shortTime(t) {
      const d = new Date(t);
      if (isNaN(d)) return '';
      return metricHours.value > 24
        ? d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' })
        : d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
    }
    function onChartMove(e) {
      const n = axisPoints.value.length;
      if (n < 2) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      const x = ratio * CW;
      const i = Math.round(((x - PAD_L) / (CW - PAD_L - PAD_R)) * (n - 1));
      hoverIdx.value = Math.max(0, Math.min(n - 1, i));
    }
    const hoverX = computed(() => xAt(hoverIdx.value, axisPoints.value.length).toFixed(1));
    const hoverTime = computed(() => {
      const p = axisPoints.value[hoverIdx.value];
      return p ? fmtTime(p.t) : '';
    });
    function hoverValue(s) {
      const p = s.points[hoverIdx.value];
      return p ? p.v.toFixed(1) + '%' : '—';
    }

    // ---- 自动刷新 ----
    const autoRefresh = ref(localStorage.getItem('ocix_auto') === '1');
    const countdown = ref(30);
    let timer = null;
    watch(autoRefresh, (on) => {
      localStorage.setItem('ocix_auto', on ? '1' : '0');
      countdown.value = 30;
    });
    onMounted(() => {
      timer = setInterval(() => {
        if (!autoRefresh.value || !token.value || document.hidden) { countdown.value = 30; return; }
        countdown.value -= 1;
        if (countdown.value <= 0) { countdown.value = 30; if (!loading.value) refreshActive(); }
      }, 1000);
    });
    onUnmounted(() => clearInterval(timer));

    onMounted(async () => {
      if (!token.value) return;
      try {
        const { data } = await axios.get('/api/auth/me');
        user.value = data.user;
        await bootData();
      } catch { /* 401 已由拦截器处理 */ }
    });

    const HOUR_RANGES = [
      { v: 1, t: '1 小时' }, { v: 6, t: '6 小时' }, { v: 24, t: '24 小时' }, { v: 168, t: '7 天' },
    ];

    return {
      CW, CH, HOUR_RANGES, areaSeries, NAV, go, orphanBadge,
      pubKeyName, ipv6Busy,
      rollName, onPubKeyFile, addIpv6,
      firewall, fwInstance, fwLoading, fwBusy, loadFirewall, allowAll, revokeAll,
      ruleForm, addRule, deleteRule, clearRules, vpuRange, vpuTier,
      upd, updBusy, updRunning, updStateText, updTagType, doUpdate,
      pwPolicy, savePwPolicy,
      tier, tierLoading, loadTier,
      sys, sysLoading, loadSystem,
      changeIp, changePerformance,
      token, user, loginForm, loginErr, loading, netBusy,
      profiles, profilesLoading, currentProfile, compartments, compsLoading, compartmentId,
      subtree, activeTab, lastUpdated, autoRefresh, countdown,
      instances, instSelection, instTableRef, usage,
      allAccounts, allFlat, allSummary, allWithIp, allSelection, allTableRef, failedAccounts,
      metrics, metricInstance, metricHours, metricsLoading,
      chartSeries, gridLines, hasMetricPoints, axisStart, axisEnd, hoverIdx, hoverX, hoverTime,
      importForm, importing, pw,
      auditLogs, auditTotal, auditActions, auditPage, auditSize, auditLoading, auditFilter,
      opts, optsLoading, createForm, isArm, canCreate, creating,
      preflight, preflightLoading, storage, storageLoading,
      doLogin, logout, refreshActive, loadAll, loadMetrics, loadAudit,
      onProfileChange, onTabChange, act, batchAct, clearInstSelection, clearAllSelection,
      canStart, canStop, canReset, stateTone, stateText, specText,
      fmtPct, fmtDate, fmtTime, fmtUtc, copy, onChartMove, hoverValue,
      onKeyFile, importProfile, testProfile, delProfile, purgeAudit, changePw,
      pickShape, onOcpuChange, runPreflight, createInstance,
      terminate, loadStorage, deleteVolume, volRowClass,
    };
  },
}).use(ElementPlus).mount('#app');
});
</script>
</body>
</html>
