<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OCIX · Oracle Always Free 开机面板</title>

  <!-- 样式层：Element Plus 与 OCIX 模块化样式 -->
  <link rel="stylesheet" href="/assets/element-plus.css" />
  <link rel="stylesheet" href="/assets/element-plus-dark.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body class="dark">
  <a class="skip-link" href="#main-content">跳到主内容</a>
  <div id="app" v-cloak>
    <!-- ━━ 登录界面 ━━ -->
    <div v-if="!token" class="login-scene">
      <canvas ref="loginCanvas" class="login-canvas" aria-hidden="true"></canvas>
      <div class="login-veil" aria-hidden="true"></div>

      <div class="login-stage">
        <div class="login-panel">
          <div class="login-brand-header">
            <div class="login-brand-logo">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="8" rx="2" /><rect x="2" y="14" width="20" height="8" rx="2" /><line x1="6" y1="6" x2="6.01" y2="6" /><line x1="6" y1="18" x2="6.01" y2="18" />
              </svg>
            </div>
            <h1 class="login-title">OCI<b>X</b></h1>
            <p class="login-sub">Oracle Always Free 开机面板</p>
          </div>

          <el-alert v-if="loginErr" type="error" :title="loginErr" :closable="false" show-icon style="margin-bottom:16px;" />

          <el-form :model="loginForm" @submit.prevent="doLogin" label-position="top">
            <el-form-item label="用户名">
              <el-input v-model="loginForm.username" size="large" placeholder="管理员账号" autofocus />
            </el-form-item>
            <el-form-item label="登录密码">
              <el-input v-model="loginForm.password" type="password" size="large" placeholder="访问口令" show-password @keyup.enter="doLogin" />
            </el-form-item>
            <el-button type="primary" size="large" :loading="loginLoading" style="width:100%; margin-top:8px;" @click="doLogin">
              登 录
            </el-button>
          </el-form>

          <div class="login-hint-bar">
            <span ref="loginFlow">OCI Cloud Global Mesh</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ━━ 主控制台界面 ━━ -->
    <div v-else>
      <div class="netbar" v-show="globalLoading" aria-hidden="true"><i></i></div>

      <!-- 顶栏 -->
      <header class="topbar">
        <div class="brand">
          <svg class="mark" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">
            <rect class="cell-sm" x="3.5" y="3.5" width="7" height="7" rx="1.6" />
            <rect class="cell-sm" x="3.5" y="13.5" width="7" height="7" rx="1.6" />
            <rect class="cell-lg" x="13.5" y="3.5" width="7" height="17" rx="1.6" />
          </svg>
          <div>
            <div class="wordmark">OCI<b>X</b></div>
            <small>Always Free 开机面板</small>
          </div>
        </div>

        <div class="topbar-right">
          <span class="live" v-if="autoRefresh">
            <i class="dot ok"></i>{{ countdown }}s 后自动刷新
          </span>
          <el-switch v-model="autoRefresh" size="small" active-text="自动刷新" />
          <span class="who">{{ user }}</span>
          <el-button size="small" @click="logout" style="display:inline-flex; align-items:center; gap:5px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>退出</span>
          </el-button>
        </div>
      </header>

      <div class="shell">
        <!-- 左侧导航 -->
        <aside class="rail">
          <nav>
            <div class="rail-group" v-for="g in NAV" :key="g.title">
              <div class="rail-title">{{ g.title }}</div>
              <button v-for="it in g.items" :key="it.name" type="button" class="rail-item"
                      :class="{ on: activeTab === it.name }"
                      :aria-current="activeTab === it.name ? 'page' : null"
                      @click="go(it.name)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path :d="it.icon" />
                </svg>
                <span>{{ it.label }}</span>
                <em v-if="it.name === 'storage' && orphanBadge" style="background:var(--crit); color:#fff; font-size:10px; padding:1px 5px; border-radius:10px; margin-left:auto; font-style:normal; font-weight:700;">{{ orphanBadge }}</em>
              </button>
            </div>
          </nav>
          <div class="rail-foot">
            <span class="ver">v{{ appVersion || '—' }}</span>
            <span class="svc" :title="serviceHint">
              <i :class="['dot', serviceOk ? 'ok' : 'crit']"></i>{{ serviceOk ? '服务正常' : '连接异常' }}
            </span>
          </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main" id="main-content" tabindex="-1">
          <h1 class="sr-only">{{ currentTabLabel }}</h1>

          <!-- 全局筛选工具条 -->
          <div class="toolbar">
            <el-select v-model="currentProfile" placeholder="选择账户" style="width:220px;"
                       :loading="profilesLoading" @change="onProfileChange"
                       :disabled="!!lockedProfile">
              <el-option v-for="p in profiles" :key="p.name" :value="p.name"
                         :label="p.name + (p.region ? ' · ' + p.region : '')" />
            </el-select>
            <el-select v-model="compartmentId" placeholder="全部 compartment" style="width:280px;"
                       clearable filterable :loading="compsLoading">
              <el-option v-for="c in compartments" :key="c.id" :value="c.id" :label="c.path" />
            </el-select>
            <el-tooltip content="默认只查租户根。开启后会逐个遍历子 compartment，查询次数成倍增加" placement="bottom">
              <el-checkbox v-model="subtree" label="含子 compartment" />
            </el-tooltip>
            <el-button type="primary" @click="refreshActive" :disabled="globalLoading">
              <svg class="btn-icon" :class="{ spin: globalLoading }" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6" />
              </svg>
              {{ globalLoading ? '刷新中…' : '刷新' }}
            </el-button>
            <span class="who" v-if="globalLoading">正在拉取…</span>
            <span class="who" v-else-if="lastUpdated">更新于 {{ lastUpdated }}</span>
          </div>

          <el-alert v-if="!profiles.length && !profilesLoading" type="warning" show-icon :closable="false"
                    title="还没有任何账户" description="到「账户配置」粘贴一份 ~/.oci/config 并附上私钥即可开始。" />

          <!-- 各 Tab 视图组件 -->
          <instances-tab v-show="activeTab === 'instances'" />
          <create-tab v-show="activeTab === 'create'" />
          <radar-tab v-show="activeTab === 'radar'" />
          <storage-tab v-show="activeTab === 'storage'" />
          <firewall-tab v-show="activeTab === 'firewall'" />
          <ssh-keys-tab v-show="activeTab === 'ssh_keys'" />
          <usage-tab v-show="activeTab === 'usage'" />
          <metrics-tab v-show="activeTab === 'metrics'" />
          <billing-tab v-show="activeTab === 'billing'" />
          <audit-tab v-show="activeTab === 'audit'" />
          <profiles-tab v-show="activeTab === 'profile'" />
          <notification-tab v-show="activeTab === 'notification'" />
          <password-tab v-show="activeTab === 'password'" />
          <update-tab v-show="activeTab === 'update'" />
        </main>
      </div>
    </div>
  </div>

  <!-- CDN 与基础脚本加载器（支持本地与公共 CDN 优雅退化） -->
  <script>
  (function () {
    var CDN = {
      'vue.global.prod.js': ['https://unpkg.com/vue@3/dist/vue.global.prod.js', 'https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js'],
      'element-plus.full.min.js': ['https://unpkg.com/element-plus/dist/index.full.min.js', 'https://cdn.jsdelivr.net/npm/element-plus/dist/index.full.min.js'],
      'axios.min.js': ['https://unpkg.com/axios/dist/axios.min.js', 'https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js']
    };
    function loadScript(url) {
      return new Promise(function (res, rej) {
        var s = document.createElement('script');
        s.src = url; s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
    }
    function chain(urls) {
      return urls.reduce(function (p, u) {
        return p.catch(function () { return loadScript(u); });
      }, Promise.reject());
    }
    window.__ocixBoot = (async function () {
      for (var name of ['vue.global.prod.js', 'element-plus.full.min.js', 'axios.min.js']) {
        try { await loadScript('/assets/' + name); } catch (e) { await chain(CDN[name]); }
      }
    })();
  })();
  </script>

  <!-- ES Modules 现代化主程序入口 -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
