# 基础编排：只定义后端，不对外暴露端口。
# 访问方式由叠加文件决定（scripts/install.sh 会自动选好）：
#   直连:  docker compose -f docker-compose.yml -f docker-compose.direct.yml up -d
#   域名:  docker compose -f docker-compose.yml -f docker-compose.caddy.yml  up -d
services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ocix:${OCIX_VERSION:-latest}
    environment:
      - OCIX_SESSION_SECRET=${OCIX_SESSION_SECRET:?未设置，请先运行 scripts/install.sh}
      - OCIX_ADMIN_USER=${OCIX_ADMIN_USER:-admin}
      - OCIX_ADMIN_PASSWORD=${OCIX_ADMIN_PASSWORD:?OCIX_ADMIN_PASSWORD 未设置}
      - OCIX_TOKEN_TTL=${OCIX_TOKEN_TTL:-1440}
      - OCIX_LAUNCH_TIMEOUT=${OCIX_LAUNCH_TIMEOUT:-180}
      - OCIX_WORKERS=${OCIX_WORKERS:-16}
      - OCIX_LOGIN_LIMIT=${OCIX_LOGIN_LIMIT:-10}
      - OCIX_API_LIMIT=${OCIX_API_LIMIT:-120}
      - OCIX_TRUST_PROXY=${OCIX_TRUST_PROXY:-false}
      - OCIX_PROXY_HOPS=${OCIX_PROXY_HOPS:-1}
      - OCIX_ENABLE_DOCS=${OCIX_ENABLE_DOCS:-false}
      - OCIX_PASSWORD_MAX_AGE_DAYS=${OCIX_PASSWORD_MAX_AGE_DAYS:-120}
      - OCIX_HOME=${OCIX_HOME:-/opt/ocix}
      - OCIX_CONTROL_DIR=/app/control
    volumes:
      - oci_config:/root/.oci
      - ocix_data:/app/data
      # 与宿主机更新代理的交换目录：面板只往里写「请求更新」的标记，
      # 真正执行更新的是宿主机上的代理。刻意不挂 docker socket。
      - ${OCIX_HOME:-/opt/ocix}/var/control:/app/control
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  oci_config:
  ocix_data:
